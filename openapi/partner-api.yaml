    /api/exchange-rate:
        get:
            tags: [API]
            operationId: getExchangeRate
            x-billable: false
            summary: Get exchange rate between two ISO 4217 currencies
            description: |
                `rate` is the value of one unit of `from` in `to`, **rounded to `to`'s minor unit**
                (2 decimals, 0 for zero-decimal currencies). A pair whose unit value is below half a minor
                unit (for example `from=NGN&to=USD`) returns `rate: 0`; see the report. Prefer
                `GET /api/convert` with a realistic amount for weak-to-strong pairs.

                **Billing:** not billable. Accepts secret or public keys.

                **Errors:**
                - 400 validation: `from must be longer than or equal to 3 characters` and similar (`from`/`to`
                  must be 3 characters after trimming).
                - 500 `No exchange rate available for <A>→<B>.` · `No MANUAL exchange rate available for <A>→<B>.`
                  (well-formed but unknown or unpriced code).
                - Auth: as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: from
                  in: query
                  required: true
                  description: Trimmed and upper-cased by the server, then must be exactly 3 characters.
                  schema:
                      type: string
                      pattern: "^\\s*\\S{3}\\s*$"
                      example: USD
                - name: to
                  in: query
                  required: true
                  description: Trimmed and upper-cased by the server, then must be exactly 3 characters.
                  schema:
                      type: string
                      pattern: "^\\s*\\S{3}\\s*$"
                      example: NGN
            responses:
                "200":
                    description: Exchange rate fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiExchangeRate"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/convert:
        get:
            tags: [API]
            operationId: convertCurrency
            x-billable: false
            summary: Convert an amount between two ISO 4217 currencies
            description: |
                Converts through USD. `convertedAmount` is rounded to `to`'s minor unit; `rate` is
                `convertedAmount / amount` (0 when `amount` is 0). All three are JSON numbers (floats).

                **Billing:** not billable. Accepts secret or public keys.

                **Errors:**
                - 400 validation: `from`/`to` must be 3 characters after trimming; `amount must be a number
                  conforming to the specified constraints` (missing or non-numeric); `amount must not be less than 0`.
                - 500 `No exchange rate available for <A>→<B>.` (unknown code).
                - Auth: as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: from
                  in: query
                  required: true
                  schema:
                      type: string
                      pattern: "^\\s*\\S{3}\\s*$"
                      example: USD
                - name: to
                  in: query
                  required: true
                  schema:
                      type: string
                      pattern: "^\\s*\\S{3}\\s*$"
                      example: NGN
                - name: amount
                  in: query
                  required: true
                  description: Parsed with `parseFloat` (so `12abc` reads as 12).
                  schema:
                      type: number
                      minimum: 0
                      example: 100
            responses:
                "200":
                    description: Amount converted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiCurrencyConversion"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/deliveries:
