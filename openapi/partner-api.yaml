                - `IDEMPOTENCY_KEY_INVALID` 400. Not 1-255 of `[A-Za-z0-9_.:-]`.
                - `IDEMPOTENCY_KEY_REUSED` 409. Same key, different request (kernel), or same key already used by
                  this account for a different create body (domain).
                - `IDEMPOTENCY_REQUEST_IN_PROGRESS` 409. The first request with this key is still running; the
                  response carries `Retry-After: 2`.
                - `IDEMPOTENCY_RESPONSE_UNAVAILABLE` 409. The key completed but its stored response is unavailable
                  (over 512 KiB or not recorded).
                - `VALIDATION_FAILED` 400. Body failed validation; see `errors[]`.
                - `CART_EMPTY` 422. CART: nothing to check out. BUY_NOW: `items` missing or empty.
                - `CART_LINE_NOT_FOUND` 404. A `lineIds` entry is not in the account's cart.
