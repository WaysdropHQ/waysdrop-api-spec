                - `WELCOME_GIFT_INELIGIBLE` 422 `{ reason }` (a `CheckoutWelcomeGiftIneligibleReason`).
                - `BAD_REQUEST` 400 (no domain code). Delivery pricing could not route the address.
                - `RATE_LIMITED` 429. Over 60 requests per minute.
                - Common: `UNAUTHENTICATED` 401, `HTTP_402` 402, `FORBIDDEN` 403, `FEATURE_DISABLED` 404,
                  `INTERNAL_ERROR` 500.
            parameters:
                - $ref: "#/components/parameters/CheckoutDeviceIdHeader"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CheckoutUpdateRequest"
