            description: Problem `code`s specific to `/v2/webhooks`. Kernel and auth codes (`VALIDATION_FAILED`, `BAD_REQUEST`, `INVALID_CURSOR`, `UNAUTHENTICATED`, `HTTP_402`, `FORBIDDEN`, `CSRF_REJECTED`, `NOT_FOUND`, `FEATURE_DISABLED`, `RATE_LIMITED`, `INTERNAL_ERROR`) also occur. `WEBHOOK_API_VERSION_UNKNOWN` is defined but unreachable today (the DTO answers 400 VALIDATION_FAILED first).
        WebhookEventType:
            type: string
            description: |
                A webhook v2 event type (apiVersion `2026-11-25`). Mirrors `schemas/webhooks/v2/catalogue.json`;
                each type has a JSON Schema `schemas/webhooks/v2/<type>.v1.json`.
