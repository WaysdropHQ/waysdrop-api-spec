            required: [deliveryFeePayer, gross, creator, recipient, promotion, matchingBlockedUntil, matchingEligible]
            properties:
                deliveryFeePayer:
                    $ref: "#/components/schemas/DeliveryFeePayer"
                gross:
                    type: object
                    required: [delivery, serviceFee, hubCommission, bundledTotal]
