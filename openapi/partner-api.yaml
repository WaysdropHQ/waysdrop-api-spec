            properties:
                lat:
                    type: number
                lon:
                    type: number
                h3Index:
                    type: string
                phrase:
                    type: string
                resolution:
                    type: integer
                centerLat:
                    type: number
                centerLon:
                    type: number
                swLat:
                    type: number
                swLon:
                    type: number
                neLat:
                    type: number
                neLon:
                    type: number
        ApiCountryOption:
            allOf:
                - $ref: "#/components/schemas/ApiGeoPointFields"
                - type: object
                  required: [value, name, type, country, countryCode]
                  properties:
                      value:
                          type: string
                          description: The country's ISO 3166-1 alpha-2 code.
                      name:
                          type: string
                      type:
                          type: string
                          const: INTER_COUNTRY
                      country:
                          type: string
                      countryCode:
                          type: string
                      countryCodeAlpha3:
                          type: string
                      continentCode:
                          type: string
                      continentName:
                          type: string
        ApiStateOption:
            allOf:
                - $ref: "#/components/schemas/ApiGeoPointFields"
                - type: object
                  required: [value, name, type, state, country, countryCode]
                  properties:
                      value:
                          type: string
                          description: "`admin1Id`, else `<countryCode>:<normalised state name>`."
                      name:
                          type: string
                      type:
                          type: string
                          const: INTER_STATE
                      state:
                          type: string
                      country:
                          type: string
                      countryCode:
                          type: string
                      continentCode:
                          type: string
                      continentName:
                          type: string
                      regionalZone:
                          type: string
                      admin1Id:
                          type: string
                      admin1Name:
                          type: string
        ApiCityOption:
            allOf:
                - $ref: "#/components/schemas/ApiGeoPointFields"
                - type: object
                  required: [value, locationId, country, countryCode, lat, lon, lgaOrCity, state, adminUnitId, adminUnitName, adminUnitType]
                  description: A system location (admin unit). Optional keys are omitted, never null.
                  properties:
                      value:
                          type: string
