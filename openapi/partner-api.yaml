openapi: 3.1.0
info:
    title: Waysdrop Partner API
    version: 3.0.0
    description: |
        Everything a Waysdrop partner can call with its API key. Source of truth for the six
        official SDKs (Node, Go, Python, PHP, Rust, Dart). Server truth: `waysdrop-server`
        branch `v2`; see CHANGELOG.md for the V2 (D22) changes and the cutover date.

        ## Authentication
        Send the key in the `api-key` header.
        - **Secret key** `wsp_<env>_<64 hex>` (`ApiKeyAuth`): server-side only. Refused when the
          request looks like a browser (browser `User-Agent`, `Origin` or `Referer`) and, when the
          key has an IP allowlist, from any other IP (401). Works on every operation here.
        - **Public key** `wsp_pub_<env>_<64 hex>` (`PublicApiKeyAuth`): browser-safe. Accepted only
          where an operation lists `PublicApiKeyAuth`; elsewhere 403 "This route is not accessible
          with a public API key". When the key has allowed origins, other origins get 403.
          Rate limited per key and client IP (default 60 requests per minute).
        - Third-party OAuth access tokens cannot call this API (403). They reach only
          `GET /oauth/userinfo` (see `oauth-protocol.yaml`).

        ## Test and live
        There is no test mode on the live API. `<env>` is `staging` or `live`: staging keys work
        only against `https://staging-api.waysdrop.com` (the test environment, with test payment
        providers) and live keys only against `https://api.waysdrop.com`. A key used on the
        other environment is 401 "Invalid API key". Webhook events carry `livemode: false` on
        staging and `true` on live. Idempotency keys, quotas and webhook endpoints are per key and
        per environment and never shared.

        ## Two generations of operations
        | | `/api/*` (v1, unchanged shape) | `/v2/*` |
        |---|---|---|
        | Success | `{ success: true, message, data }` | `{ success: true, data }` |
        | Error | `ApiErrorResponse` (`statusCode`, `message`, `details`, …) | `Problem` (RFC 9457 style; switch on `code`) |
        | Money | legacy numbers / decimal strings and `DisplayMoney` | `MoneyWire` `{ amountMinor: "<integer string>", currency }` |
        | Lists | `page`/`limit` | keyset: `limit` (1–50, default 20) + opaque `cursor` → `page.nextCursor` |
        | Writes | not idempotent | `Idempotency-Key` header (see below) |

        Request bodies: unknown fields are silently stripped (never rejected), and a top-level
        string field sent as `""` is treated as absent.

        Every machine-readable error code a partner can receive is in `ErrorCode`; each
        operation lists the codes it can return in `x-error-codes`. On `/v2` read `code`
        (also mirrored in `details.code`); on `/api/*` read `details.code` when present.
        Never branch on `message` text.

        ## Idempotency (`/v2` writes)
        `Idempotency-Key: <1–255 chars of [A-Za-z0-9_.:-]>`; send a new UUID per user action and
        reuse it on every retry of that action. Keys are scoped to the account **and the API key**
        that sent them (another key, or the dashboard, is a different key space). The request is
        fingerprinted as method + concrete path + query + body.
        - first use: runs, and a success is stored for 24 h;
        - same key, same request, finished: the stored status and body, header `Idempotent-Replayed: true`;
        - same key, different request: 409 `IDEMPOTENCY_KEY_REUSED`;
        - same key while the first is still running: 409 `IDEMPOTENCY_REQUEST_IN_PROGRESS`, `Retry-After: 2`
          (a claim older than 2 minutes is taken over);
        - the first attempt failed (any error): nothing is stored; retrying with the same key runs again;
        - stored body over 512 KB: 409 `IDEMPOTENCY_RESPONSE_UNAVAILABLE`.
        Missing key on a required route: 400 `IDEMPOTENCY_KEY_REQUIRED`; malformed: 400 `IDEMPOTENCY_KEY_INVALID`.

        ## Rate limits
        - **Global throttle**: 180 requests per minute per client IP (API-key requests are keyed on
          the IP, not the key); some operations set a lower `x-rate-limit`. Responses carry
          `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (seconds); a 429 adds
          `Retry-After` (seconds) and blocks the IP for 10 s. `/v2` code: `RATE_LIMITED`.
        - **Quota** (secret keys, when the key has quota assignments set in the dashboard): checked
          on every operation, billable or not; 429 "API quota exceeded" with
          `details.quota` = `QuotaExceededDetails` (no rate-limit headers). Operations marked
          `x-billable: false` are not charged as usage but are still refused while over quota.
        - **Unpaid usage**: a secret key whose account owes API usage beyond its wallet balance
          gets 402 on every operation (`/v2` code `HTTP_402`) until the balance is topped up.
        - **Maintenance**: 400 "We're currently under maintenance. Please try again later." while
          the server is in maintenance mode; in read-only mode every non-GET is 400.
        - **Public keys**: per key and client IP per minute (`PUBLIC_API_KEY_RATE_LIMIT_PER_MIN`,
          default 60): 429 "Public API key rate limit exceeded".

        ## Correlation
        Every response has `X-Correlation-Id`. Send your own (`X-Correlation-Id` or `X-Request-Id`,
        8–64 chars of `[A-Za-z0-9_-]`) to have it echoed; quote it to support.

        ## Feature flags
        `/v2` operations ship dark behind server flags (`x-feature-flag`), enabled per partner
        account. While off they answer 404 `FEATURE_DISABLED`.
servers:
    - url: https://staging-api.waysdrop.com
      description: Staging (test environment; `wsp_staging_` and `wsp_pub_staging_` keys)
    - url: https://api.waysdrop.com
      description: Live (`wsp_live_` and `wsp_pub_live_` keys)
security:
    - ApiKeyAuth: []
tags:
    - name: API
      description: Delivery, pricing, payments and reference data (`/api/*`, v1 envelope)
    - name: Commerce (V2)
      description: Multi-store checkout sessions and order cancel (`/v2`, flag `COMMERCE_V2`)
    - name: Webhooks (V2)
      description: Webhook endpoints, secrets, delivery logs, resend, replay and ping (`/v2`, flag `PARTNER_WEBHOOKS_V2`)
paths:
    /api/countries:
        get:
            tags: [API]
            operationId: listCountries
            x-billable: false
            summary: Fetch available countries
            description: |
                Countries Waysdrop operates in (route catalog, `INTER_COUNTRY`), sorted by name.
                Each entry is deduplicated by `countryCode`; its geo fields (`lat`, `lon`, `h3Index`, ...)
                are those of the first admin unit seen for that country, not a country centroid.

                Returns at most 100 entries. The `limit` query parameter is NOT accepted on this route:
                the controller binds `SearchDTO` (search only), so `limit` is stripped and ignored.

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:** 400 `search must be a string` (only reachable with a repeated `search`).
                Auth: 401 `API key is required` · `Invalid API key format` · `Invalid API key` · `API key validation failed` ·
                `Your IP address is not whitelisted to use this API key` (secret key); 402 `Insufficient wallet balance for API usage`
                (secret key); 403 `API key is inactive` · `API key has expired` · `Request origin is not allowed for this public API key`
                (public key) · `Secret API keys cannot be used in client-side applications (browsers). Use your public key for browser-safe routes.`
                (secret key); 429 `API quota exceeded` (secret key, `details.quota`) · `Public API key rate limit exceeded` (public key).
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: search
                  in: query
                  required: false
                  description: Free-text filter. Blank returns the catalog head.
                  schema:
                      type: string
            responses:
                "200":
                    description: Countries fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              type: array
                                              maxItems: 100
                                              items:
                                                  $ref: "#/components/schemas/ApiCountryOption"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/states:
        get:
            tags: [API]
            operationId: listStates
            x-billable: false
            summary: Fetch available states
            description: |
                First-level admin units (route catalog, `INTER_STATE`), sorted by name, deduplicated by
                `value` (`admin1Id`, else `<countryCode>:<normalised state>`).

                Returns at most 100 entries. `limit` is NOT accepted (stripped; see `listCountries`).

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:** same as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: search
                  in: query
                  required: false
                  schema:
                      type: string
            responses:
                "200":
                    description: States fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              type: array
                                              maxItems: 100
                                              items:
                                                  $ref: "#/components/schemas/ApiStateOption"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/cities:
        get:
            tags: [API]
            operationId: listCities
            x-billable: false
            summary: Fetch available cities
            description: |
                System locations (every active admin unit with a coordinate), from the indexed
                location search. With no `search`, the first 100 in catalog order (country, level, name);
                with `search`, the best 100 matches by score. Unlike countries/states, entries carry no
                `name` or `type`; use `lgaOrCity` / `adminUnitName` for display.

                Returns at most 100 entries. `limit` is NOT accepted (stripped; see `listCountries`).

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:** same as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: search
                  in: query
                  required: false
                  schema:
                      type: string
            responses:
                "200":
                    description: Cities fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              type: array
                                              maxItems: 100
                                              items:
                                                  $ref: "#/components/schemas/ApiCityOption"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/route:
        post:
            tags: [API]
            operationId: getRoute
            x-error-codes: [ADDRESS_PIN_MISMATCH, MAPS_UPSTREAM_UNAVAILABLE]
            x-billable: false
            summary: Get route data between two addresses
            description: |
                Resolves both points, then returns the driving distance and ETA (the larger of the road
                and straight-line values) and the route type. `origin` and `destination` are
                `PartnerAddress` projections of the resolved points (no `id`, timestamps or contacts:
                nothing is saved).

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:**
                - 400 validation (for example `origin.lat: lat must not be greater than 90`,
                  `origin.googlePlaceId: googlePlaceId must be a valid Google place id`).
                - 400 `Unregistered location` · `Invalid Location` · `Invalid location` (point outside the
                  operated area, or no geocode hit) · `lat and lon are required when pinSource is <SOURCE>` ·
                  `googlePlaceId is required when pinSource is PLACE` · `Invalid geocode parameters`.
                - 422 `ADDRESS_PIN_MISMATCH` (`details.code`; `details.field` is `origin` or `destination`).
                - 503 `Location service is temporarily unavailable. Please try again shortly.`
                  (`details.code: MAPS_UPSTREAM_UNAVAILABLE`).
                - 500 when `origin` or `destination` is omitted: the DTO does not reject a missing point
                  (known issue; fix pending); always send both.
                - Auth: as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiGetRouteData"
            responses:
                "200":
                    description: Route data fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiRouteData"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "422":
                    $ref: "#/components/responses/AddressPinMismatch"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
                "503":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/fleet-types:
        get:
            tags: [API]
            operationId: listFleetTypes
            x-billable: false
            summary: Fetch available fleet types
            description: |
                Fleet types with status `ACTIVE`, oldest first. Not paginated.

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:** auth only, as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            responses:
                "200":
                    description: Fleet types fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: "#/components/schemas/ApiFleetType"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/pricing:
        post:
            tags: [API]
            operationId: getPricing
            x-error-codes: [ADDRESS_PIN_MISMATCH, DELIVERY_PRICING_BLOCKED, MAPS_UPSTREAM_UNAVAILABLE]
            x-billable: false
            summary: Get pricing for a delivery request
            description: |
                Two modes, two response shapes (see `ApiPricingResult`):

                - **By packages** (`packagesId` non-empty): prices your saved, unassigned packages exactly as
                  `POST /api/request` would (merchant delivery pricing, recommended fleet when `fleetTypeId`
                  is omitted, service fee removed). Response: `ApiPackagePricingQuote` (`deliveryCost`,
                  `feeShares`, `deliveryFee`, ... with `*Display` fields). `totalValue`, when sent, overrides
                  the package total and is in **USD**.
                - **By totals** (no `packagesId`): `totalWeight` (kg) and `totalValue` (USD) are required.
                  Response: `ApiPricingEstimate` (`costs`, `breakdown`, no `*Display` fields; the `currency`
                  query/body parameter has no effect in this mode).

                In both modes `costs.serviceFee` is `"0"` (service fee is not charged on merchant API
                deliveries) and `costs.total` excludes it. `urgencyType` and `deliveryDate` do not change
                the price. `courierSelection` / `deliveryFeePayer` only affect the packages mode.

                **Billing:** not billable. Secret-key calls still count toward the key's quota.

                **Errors:**
                - 400 validation; `currency must be a 3-letter ISO 4217 code` (query or body `currency`).
                - 400 `Provide packagesId or both totalWeight and totalValue` · `No fleet type found for the
                  given weight` · `Unable to determine distance` · `Origin and destination must be different
                  locations` · `Profile is not a courier` · location errors as `getRoute`.
                - 400 `DELIVERY_PRICING_BLOCKED` (`details.code`; also `details.fleetTypeId`, `details.reason`):
                  the merchant's or courier's delivery pricing blocks this fleet.
                - Packages mode only: 400 `One or more packages are invalid or already in a delivery` ·
                  `<name> quantity must be a whole number from 1 to 999` · `<name> has an invalid declared value.
                  Edit the package and enter its value again.` · `totalValue must be zero or more` ·
                  `Courier is required for specific matching` · `Courier profile is suspended` · `Courier user is
                  banned`; 404 `Courier profile not found`; 409 `You cannot request delivery with yourself`.
                - 400 `Authenticated user is required when pricing by packagesId` is unreachable through the
                  API key guard (the key always resolves a user).
                - 404 `Fleet type not found` · `Profile not found` (courierId / courierProfileId).
                - 422 `ADDRESS_PIN_MISMATCH` (`details.field`: `origin` | `destination`).
                - 503 `MAPS_UPSTREAM_UNAVAILABLE`.
                - Auth: as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: currency
                  in: query
                  required: false
                  description: |
                      ISO 4217 code for the `*Display` fields of this response only (packages mode).
                      Case-insensitive; trimmed; must be 3 letters (400 otherwise). Wins over body `currency`.
                  schema:
                      type: string
                      pattern: "^\\s*[A-Za-z]{3}\\s*$"
                      example: NGN
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiCalculateRouteCost"
            responses:
                "200":
                    description: Pricing fetched successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiPricingResult"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "404":
                    $ref: "#/components/responses/ErrorEnvelope"
                "409":
                    $ref: "#/components/responses/ErrorEnvelope"
                "422":
                    $ref: "#/components/responses/AddressPinMismatch"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
                "503":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/request:
        post:
            tags: [API]
            operationId: createDeliveryRequest
            x-error-codes: [ADDRESS_PIN_MISMATCH, DELIVERY_PRICING_BLOCKED, MAPS_UPSTREAM_UNAVAILABLE]
            x-billable: true
            summary: Create a delivery request
            description: |
                Creates a P2P delivery from your saved packages and charges your delivery-fee share.
                Returns **201**. The `data` shape depends on the path taken (`ApiDeliveryRequestResult`):

                - `paymentMethodType` `WALLET` (default): `ApiDeliveryRequestWalletResult`, the created
                  `P2pDelivery` with `delivery` (including `origin` / `destination` as `PartnerAddress`),
                  `deliveryFee`, `matchingEligible`. Your MERCHANT wallet (home currency) is debited.
                  `delivery.deliveryNotes`, `delivery.externalReference` and the proof-code flags show their
                  values from before `note` / `externalReference` / `require*ProofCode` were applied.
                - `paymentMethodType` `CHECKOUT`: `ApiDeliveryRequestCheckoutResult`, a hosted checkout (snake_case
                  keys) plus `deliveryFee`. It carries no delivery id, and `note`, `externalReference` and
                  `require*ProofCode` are NOT applied on this path (known issue; fix pending).
                - `externalReference` that already exists on one of your deliveries: `ApiDeliveryRequestReplay`
                  (the stored delivery, no addresses), not an error. Only WALLET creates store the reference.
                - `CARD` and `BANK_ACCOUNT` pass validation but are not supported flows; their shapes are not
                  documented here Use `WALLET` or `CHECKOUT` only.

                `deliveryFeePayer` `RECIPIENT` (without `payPackageValue`) always fails with 400 through this API
                today, and `SPLIT` with `WALLET` fails AFTER the delivery is created and your wallet debited (see
                report).

                **Billing:** billable (each 2xx is metered). Secret key only.

                **Errors (before anything is created):**
                - 400 validation (`destinationContactPhone must be a valid phone number`, `podRemitTo must be one
                  of the following values: ...`, ...); `currency must be a 3-letter ISO 4217 code`.
                - 404 `No merchant specific couriers found. Please add a courier to your list on the merchant
                  dashboard.` (`MERCHANT_SPECIAL_COURIERS`) · `Profile not found` · `Fleet type not found` ·
                  `Origin address not found` · `Destination address not found` · `Courier profile not found`.
                - 400 location: `Origin address is required` · `Destination address is required` · `Origin and
                  destination cannot be the same` · `Origin and destination must be different locations` ·
                  `Unable to determine delivery locations` · `Address is required when coordinates are zero` ·
                  `Address, coordinates, or Google place id is required` · `Unregistered location` · `Invalid
                  Location` · `googlePlaceId is required when pinSource is PLACE` · `lat and lon are required when
                  pinSource is <SOURCE>`.
                - 422 `ADDRESS_PIN_MISMATCH` (`details.field`: `origin` | `destination`).
                - 400 scheduling: `urgencyType SCHEDULED requires deliveryDate and deliverySlot` · `deliveryDate and
                  deliverySlot require urgencyType SCHEDULED` · `deliverySlot is required when deliveryDate is
                  provided` · `deliveryDate is required when deliverySlot is provided` · `Invalid delivery slot
                  format. Expected format: HH:mm - HH:mm` · `Invalid time values in delivery slot` · `End time must
                  be after start time` · `Delivery slot must have at least 1 hour difference between start and end
                  time` · `Delivery slot has already expired`.
                - 400 packages / pricing: `One or more packages are invalid or already in a delivery` · `<name>
                  quantity must be a whole number from 1 to 999` · `<name> has an invalid declared value. Edit the
                  package and enter its value again.` · `Unable to determine distance` · `Profile is not a
                  courier` · `DELIVERY_PRICING_BLOCKED` (`details.code`, `details.fleetTypeId`, `details.reason`).
                - 400 courier: `Courier is required for specific matching` · `Courier profile is suspended` ·
                  `Courier user is banned` · `Pay on delivery is not enabled on this courier profile.`;
                  409 `You cannot request delivery with yourself`.
                - 400 rules: `payPackageValue and payOnDelivery cannot both be enabled` · `podRemitTo is required
                  when payOnDelivery is enabled` · `deliveryFeePayer could not be applied to this request` ·
                  `paymentMethodType must not be set when the creator has no upfront payment` · `Destination
                  contact phone and email are required when the recipient pays the delivery fee` · `Promo code
                  could not be applied` (automatic promotion).
                - 422 `Insufficient balance` (WALLET; no `details.code`) — rolled back.
                - 400 `Payment ledger missing` · `Invalid address payload` — rolled back.
                - 429 `There is currently an ongoing p2p request creation in your account. Try again later..`
                  (plain-string exception, no `details`).
                - 503 `MAPS_UPSTREAM_UNAVAILABLE`.

                **Errors AFTER the delivery is committed** (the delivery exists; WALLET has been debited):
                400 `Creator delivery fee was already paid; recipient checkout cannot be created in the same
                request` (SPLIT + WALLET) · `POD session already exists for delivery` · `Recipient delivery fee
                payment already exists for this delivery`; CHECKOUT only: 400 `Invalid callback URL` · `Callback URL
                must use http or https` · `Callback URL origin is not allowed` · `Amount must be greater than zero` ·
                `Amount below minimum for <PROCESSOR> in <CUR>` · `No currency configured for country <CC>.`;
                500 on a concurrent duplicate `externalReference`, an unknown display `currency`, or (CHECKOUT) a
                missing home-currency merchant wallet.

                Auth: as `createOrUpdatePackage`.
            security:
                - ApiKeyAuth: []
            parameters:
                - name: currency
                  in: query
                  required: false
                  description: ISO 4217 code for the `*Display` fields. Case-insensitive; 3 letters (400 otherwise). Wins over body `currency`.
                  schema:
                      type: string
                      pattern: "^\\s*[A-Za-z]{3}\\s*$"
                      example: NGN
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiCreateDeliveryRequest"
            responses:
                "201":
                    description: Delivery request created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiDeliveryRequestResult"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "404":
                    $ref: "#/components/responses/ErrorEnvelope"
                "409":
                    $ref: "#/components/responses/ErrorEnvelope"
                "422":
                    description: |
                        `ADDRESS_PIN_MISMATCH` (`AddressPinMismatchError`, `details.code` set) or `Insufficient balance`
                        (plain `ApiErrorResponse`, `details: { error: "Unprocessable Entity" }`, no `details.code`).
                    content:
                        application/json:
                            schema:
                                oneOf:
