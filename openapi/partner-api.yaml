    /v2/checkout-sessions/{id}/confirm:
        parameters:
            - $ref: "#/components/parameters/CheckoutSessionIdPath"
        post:
            operationId: confirmCheckoutSession
            x-error-codes: [ADDRESS_REQUIRED, BAD_REQUEST, CHECKOUT_SESSION_EXPIRED, CHECKOUT_SESSION_NOT_FOUND, CHECKOUT_SESSION_STATE, CONCURRENT_REQUEST, DELIVERY_UNAVAILABLE, IDEMPOTENCY_KEY_INVALID, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_REUSED, IDEMPOTENCY_REQUEST_IN_PROGRESS, IDEMPOTENCY_RESPONSE_UNAVAILABLE, INSUFFICIENT_BALANCE, INSUFFICIENT_STOCK, NO_STORE_INCLUDED, PAYMENT_START_FAILED, PRODUCT_UNAVAILABLE, PROMO_INVALID, RATE_LIMITED, SETUP_REQUIRED, TOTAL_CHANGED, VALIDATION_FAILED, WALLET_NOT_ALLOWED, WALLET_PICKER_DISABLED, WELCOME_GIFT_INELIGIBLE]
            tags: [Commerce (V2)]
            summary: Place the orders and pay
            x-feature-flag: COMMERCE_V2
            x-feature-flag-secondary: WALLET_PICKER_V2
            security:
                - ApiKeyAuth: []
            description: |
                Re-prices everything from the database, checks the setup gate, the total the buyer saw, stock,
                availability, delivery and codes, then in one transaction moves the session out of DRAFT, reserves
                stock, redeems promotions, claims the welcome gift, creates one order (with its delivery) per
                included store, and takes the payment. Returns 200 (not 201). Rate limit: 20 requests per minute
                (per user for JWT callers, per client IP for API-key callers).

                Payment:
                - `WALLET` without `payFromWalletId`: debited now, pooled across the account's PRIMARY wallets,
                  one debit per child order. Session `PAID`, children `PENDING`. Every cart line the session was
                  created from is removed from the cart, including lines of excluded stores.
                - `WALLET` with `payFromWalletId` (needs `WALLET_PICKER_V2`): only that wallet is debited, in its
                  own currency, at the rate locked by `payment-preview` for that currency if still valid, else
                  the live rate. `expectedNativeMinor` is optional; when sent it must equal the native total.
                - `HOSTED`: one provider checkout for the session total. Session `AWAITING_PAYMENT`, children
                  `PENDING_PAYMENT`; `payment.hosted.checkoutUrl` is where the payer goes. If the provider call
                  fails transiently after the orders were placed, the response is `503 PAYMENT_START_FAILED`;
                  retry with the SAME key and body to start it again.
                - A total of exactly 0 is placed as `WALLET` with no debit, whatever `method` says, and
                  `payFromWalletId` is then ignored.

                Idempotency: `Idempotency-Key` is required. The kernel replays a completed 200 for 24 h per
                (account, credential) with `Idempotent-Replayed: true`. The session also stores the confirm key:
                a later confirm with the same key and body returns the session's current result (no
                `Idempotent-Replayed` header); a different key on a placed session is `409 CHECKOUT_SESSION_STATE`.
                A HOSTED session whose provider checkout was never started is started again by such a replay.
                Unknown fields are silently stripped, not rejected (a misspelled `payFromWalletId` is ignored and
                the payment is pooled).

                Errors (`code`, status, `details` keys):
                - `IDEMPOTENCY_KEY_REQUIRED` 400, `IDEMPOTENCY_KEY_INVALID` 400, `IDEMPOTENCY_KEY_REUSED` 409,
                  `IDEMPOTENCY_REQUEST_IN_PROGRESS` 409 (`Retry-After: 2`), `IDEMPOTENCY_RESPONSE_UNAVAILABLE` 409.
                - `BAD_REQUEST` 400. `id` is not a UUID.
                - `VALIDATION_FAILED` 400. Body failed validation; see `errors[]`.
                - `CHECKOUT_SESSION_NOT_FOUND` 404.
                - `CONCURRENT_REQUEST` 429. Another confirm of this session holds the 60 s lock.
                - `CHECKOUT_SESSION_EXPIRED` 410.
                - `CHECKOUT_SESSION_STATE` 409. Already placed (with a different key), or not a DRAFT.
                - `WALLET_PICKER_DISABLED` 422. `payFromWalletId` sent while `WALLET_PICKER_V2` is off.
                - `WALLET_NOT_ALLOWED` 422. `payFromWalletId` with `method: HOSTED`, or a wallet the account
                  cannot pay from.
                - `SETUP_REQUIRED` 403 `{ missing: ("PHONE_VERIFIED" | "ADDRESS")[] }`.
                - `ADDRESS_REQUIRED` 422. Defined, but in practice a missing address fails `SETUP_REQUIRED` first.
                - `NO_STORE_INCLUDED` 422.
                - `INSUFFICIENT_STOCK` 409 `{ stores: CheckoutStockShortfall[] }`.
                - `PRODUCT_UNAVAILABLE` 409 `{ storeIds: string[] }`. A line is unavailable, its store is not
                  selling, or its options are invalid.
                - `DELIVERY_UNAVAILABLE` 422 `{ storeIds: string[] }`. A store leg has no priced delivery or no
                  origin.
                - `PROMO_INVALID` 409 `{ promoCode, reason }`. A code on the session is no longer valid, or ran
                  out while placing.
                - `WELCOME_GIFT_INELIGIBLE` 422 `{ reason }`. `reason` is a
                  `CheckoutWelcomeGiftIneligibleReason`; `ALREADY_CLAIMED` when the claim lost a race.
                - `TOTAL_CHANGED` 409 `{ total: MoneyWire }` when `expectedTotalMinor` differs from the server
                  total, or `{ nativeCharge: MoneyWire }` when `expectedNativeMinor` differs from the picked
                  wallet's native total.
                - `INSUFFICIENT_BALANCE` 422. The picked wallet, or the pooled wallets, do not cover the total.
                - `PAYMENT_START_FAILED` 503 `{ sessionId }`. HOSTED only; the orders are placed.
                - `BAD_REQUEST` 400 (no domain code). The personal profile or primary wallet is missing; delivery
                  pricing could not route the address; or the payment provider refused the hosted charge with a
                  4xx after the orders were placed (for example "Country XX is not active on Waysdrop."). In the
                  last case a same-key retry hits the same refusal.
                - `RATE_LIMITED` 429. Over 20 requests per minute.
                - Common: `UNAUTHENTICATED` 401, `HTTP_402` 402, `FORBIDDEN` 403, `FEATURE_DISABLED` 404,
                  `INTERNAL_ERROR` 500.
            parameters:
                - $ref: "#/components/parameters/IdempotencyKey"
                - $ref: "#/components/parameters/CheckoutDeviceIdHeader"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CheckoutConfirmRequest"
            responses:
                "200":
                    description: The placed session's orders and payment.
                    headers:
                        Idempotent-Replayed:
                            description: "`true` when this is a kernel replay of an earlier completed request with the same key."
                            schema:
                                type: string
                                enum: ["true"]
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [success, data]
                                properties:
                                    success:
                                        const: true
                                    data:
                                        $ref: "#/components/schemas/CheckoutConfirmResult"
                "400":
                    $ref: "#/components/responses/Problem"
                "401":
                    $ref: "#/components/responses/Problem"
                "402":
                    $ref: "#/components/responses/Problem"
                "403":
                    $ref: "#/components/responses/Problem"
                "404":
                    $ref: "#/components/responses/Problem"
                "409":
                    $ref: "#/components/responses/Problem"
                "410":
                    $ref: "#/components/responses/Problem"
                "422":
                    $ref: "#/components/responses/Problem"
                "429":
