            description: |
                Deliveries created with **this** API key (`apiKeyId`) on your account, not soft-deleted,
                newest first. `search` matches `trackingId` (case-insensitive substring).

                Note the double nesting: the page is at `data.data`, the counts at `data.meta`.

                **Billing:** billable (each 2xx is metered). Secret key only.

                **Errors:** 400 validation (`status must be one of the following values: ...`,
                `externalReference must be shorter than or equal to 128 characters`) ·
                `currency must be a 3-letter ISO 4217 code`; auth as `createOrUpdatePackage`.
            security:
                - ApiKeyAuth: []
            parameters:
                - name: currency
                  in: query
                  required: false
