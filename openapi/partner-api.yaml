                The merchant's / courier's delivery pricing (v2) result for this request. Present when a
                delivery pricing config applies. `status` `PRICED` set the fee; `FALLBACK` means Waysdrop
                general pricing was used.
            required: [configId, version, ownerType, ownerProfileId, merchantId, courierProfileId, fleetTypeId, fleetTypeName, status, reason, fee, feeUsd, currencyCode, breakdown, fx]
            properties:
                configId:
                    type: string
                    format: uuid
                version:
                    type: integer
                ownerType:
                    $ref: "#/components/schemas/ApiDeliveryPricingOwnerType"
                ownerProfileId:
                    type: [string, "null"]
                merchantId:
                    type: [string, "null"]
                courierProfileId:
                    type: [string, "null"]
                fleetTypeId:
                    type: [string, "null"]
                fleetTypeName:
                    type: [string, "null"]
                status:
                    type: string
                    enum: [PRICED, FALLBACK, BLOCKED]
                reason:
                    type: [string, "null"]
                fee:
                    type: [number, "null"]
                    description: PRICED only. The fee in `currencyCode` (JSON number, float).
                feeUsd:
                    type: [string, "null"]
                    description: PRICED only. USD amount as a fixed 2-decimal string (`"12.50"`).
                currencyCode:
                    type: string
                breakdown:
                    oneOf:
                        - type: "null"
                        - type: object
                          required: [distance, weight]
                          properties:
                              distance:
                                  type: [number, "null"]
                              weight:
                                  type: array
                                  items:
                                      type: object
                                      required: [type, amount]
                                      properties:
                                          type:
                                              type: string
                                          amount:
                                              type: number
