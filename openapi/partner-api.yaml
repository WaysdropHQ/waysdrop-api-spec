                deliverySubtotal:
                    $ref: "#/components/schemas/ApiDecimalString"
                total:
                    $ref: "#/components/schemas/ApiDecimalString"
                weight:
                    $ref: "#/components/schemas/ApiDecimalString"
                surcharge:
                    $ref: "#/components/schemas/ApiDecimalString"
                serviceFee:
