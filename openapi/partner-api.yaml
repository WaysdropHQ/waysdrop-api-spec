                - `ADDRESS_NOT_FOUND` 404. `addressId` is not one of the account's saved addresses.
                - `BAD_REQUEST` 400 (no domain code). Delivery pricing could not route the address (for example
                  "Unable to determine distance"). The session has already been created when this happens.
                - Common: `UNAUTHENTICATED` 401, `HTTP_402` 402 (API usage billing), `FORBIDDEN` 403,
                  `FEATURE_DISABLED` 404, `RATE_LIMITED` 429 (`details.quota` on an API-key quota breach),
