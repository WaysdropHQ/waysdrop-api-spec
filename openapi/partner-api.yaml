    /api/package:
        post:
            tags: [API]
            operationId: createOrUpdatePackage
            x-billable: true
            summary: Create or edit a package
            description: |
                Without `packageId`: creates a package (`name`, `quantity`, `value`, `size` required).
                With `packageId`: edits your unassigned package; every other field is optional and only the
                fields sent change.

                `value` is the unit's declared value in `inputCurrency`; when `inputCurrency` is omitted it
                is read in your account's display currency (not USD). It is stored as USD (`value`) with the
                typed amount kept in `inputAmount`/`inputCurrencyCode`. On create it must be greater than 0;
                on edit a `value` of 0 is ignored.

                `weight` cannot be set: it is derived from `size` (SMALL 2 kg, MEDIUM 7 kg, LARGE 15 kg) on
                create and is not changed by an edit.

                **Billing:** billable (each 2xx is metered). Secret key only.

                **Errors:**
                - 400 validation; `currency must be a 3-letter ISO 4217 code` (query `currency` or body
                  `inputCurrency`); `Package value must be greater than zero` (create);
                  `Quantity must be a whole number from 1 to 999`; `Package is already in a request` (edit).
                - 404 `Package not found` (edit: not yours, not a package item, or unknown id).
                - 500 when `inputCurrency` is a well-formed but unknown code (no exchange rate).
                - Auth: 401 `API key is required` · `Invalid API key format` · `Invalid API key` · `API key validation failed` ·
                  `Your IP address is not whitelisted to use this API key`; 402 `Insufficient wallet balance for API usage`;
                  403 `API key is inactive` · `API key has expired` · `This route is not accessible with a public API key` ·
                  `Secret API keys cannot be used in client-side applications (browsers). Use your public key for browser-safe routes.`;
                  429 `API quota exceeded` (`details.quota`).
            security:
                - ApiKeyAuth: []
            parameters:
                - name: currency
                  in: query
                  required: false
                  description: ISO 4217 code for `valueDisplay` only. Case-insensitive; 3 letters (400 otherwise).
                  schema:
                      type: string
                      pattern: "^\\s*[A-Za-z]{3}\\s*$"
                      example: NGN
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiCreateOrEditPackage"
            responses:
                "201":
                    description: Package saved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
