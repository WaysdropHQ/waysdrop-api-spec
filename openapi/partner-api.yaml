                `ApiPackagePricingQuote` when the request had a non-empty `packagesId` (has `deliveryCost`),
                else `ApiPricingEstimate` (has `costs` at the top level).
            oneOf:
                - $ref: "#/components/schemas/ApiPackagePricingQuote"
                - $ref: "#/components/schemas/ApiPricingEstimate"
        # ---------------------------------------------------------------- packages
