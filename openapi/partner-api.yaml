                  schema:
                      type: string
                      pattern: "^\\s*[A-Za-z]{3}\\s*$"
                      example: NGN
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: "#/components/schemas/DeliveryStatus"
                - name: externalReference
                  in: query
                  required: false
                  description: Exact match after trimming.
