                        application/json:
                            schema:
                                type: object
                                required: [success, data]
                                properties:
                                    success:
                                        const: true
                                    data:
                                        $ref: "#/components/schemas/CheckoutSessionView"
                "400":
                    $ref: "#/components/responses/Problem"
                "401":
                    $ref: "#/components/responses/Problem"
