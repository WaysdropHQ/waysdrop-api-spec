                that can pay (PRIMARY, ACTIVE, not deleted, on the personal profile or unattached, with a usable
                USD rate), the exact native amount confirm would debit if that wallet were picked. The native
                charge is the sum of each store leg's total converted on its own, which is exactly what confirm
                debits.

                This GET writes: it locks the USD rate of one currency on the session for 10 minutes (the
                currency of `payFromWalletId` when given, else of the recommended wallet). A confirm that picks a
