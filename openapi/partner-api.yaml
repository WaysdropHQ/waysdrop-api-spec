    /api/payments/checkout:
        post:
            tags: [API]
            operationId: createPaymentCheckout
            x-billable: false
            summary: Start hosted checkout for customer payment
            description: |
                Creates a PENDING payment (deposit) to your MERCHANT wallet and a hosted checkout
                (Nomba / Paystack / Stripe). Returns **200**, not 201. Response keys are snake_case.

                - Currency: `inputCurrency`, else `currencyCode`, else your home wallet currency. Only your
                  home currency or USD is accepted. When both are sent, `inputCurrency` wins.
                - `externalReference` (preferred) or `merchantReference`: trimmed; unique per account. A
                  reuse is 409. The payment row is created before the processor call, so a failed attempt
                  still holds its reference (retrying with the same reference returns 409).
                - `callbackUrl`: must be http(s) on a Waysdrop-allowed origin (Waysdrop dashboards and
                  `localhost:3000`/`3001`); a merchant's own domain is rejected today. `ref=<reference>` is
                  appended.
                - Known issue (fix pending): always read the charged currency and amount from `charge_currency` /
                  `charge_amount` in the response, and confirm payment with `getPaymentByExternalReference`
                  rather than waiting for the `payment.received` webhook.

                **Billing:** not billable. Accepts secret or public keys.

                **Errors:**
                - 400 validation (`amount must be a positive number`, `customerEmail must be an email`, ...);
                  `currency must be a 3-letter ISO 4217 code`; `Deposits are supported for your home wallet
                  (<CUR>) or USD.`; `Invalid callback URL` · `Callback URL must use http or https` ·
                  `Callback URL origin is not allowed`; `Amount must be greater than zero`;
                  `Amount below minimum for <PROCESSOR> in <CUR>`; `Country <CC> is not active on Waysdrop.` ·
                  `No currency configured for country <CC>.`
                - 409 `A payment with this external reference already exists`.
                - 429 `There is currently an ongoing payment checkout in your account. Try again later..`
                  (one checkout at a time per API key; plain-string exception, no `details`).
                - Processor errors pass through with the processor's status and body (`details`); a Nomba
                  business failure surfaces as 500 `An error occurred`. A concurrent duplicate reference is
                  500, not 409.
                - Auth: as `listCountries`.
            security:
                - ApiKeyAuth: []
                - PublicApiKeyAuth: []
            parameters:
                - name: currency
                  in: query
                  required: false
                  description: |
                      Validated (3 letters, 400 otherwise) but has no effect on the response; it can only steer
                      the collection country when your account has no phone or country.
                  schema:
                      type: string
                      pattern: "^\\s*[A-Za-z]{3}\\s*$"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ApiCreatePaymentCheckout"
            responses:
                "200":
                    description: Payment checkout started successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/ApiSuccessResponse"
                                    - type: object
                                      required: [data]
                                      properties:
                                          data:
                                              $ref: "#/components/schemas/ApiPaymentCheckout"
                "400":
                    $ref: "#/components/responses/ErrorEnvelope"
                "401":
                    $ref: "#/components/responses/ErrorEnvelope"
                "402":
                    $ref: "#/components/responses/ErrorEnvelope"
                "403":
                    $ref: "#/components/responses/ErrorEnvelope"
                "409":
                    $ref: "#/components/responses/ErrorEnvelope"
                "429":
                    $ref: "#/components/responses/ErrorEnvelope"
    /api/payments/by-external-reference/{externalReference}:
