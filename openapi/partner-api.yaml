                trackingId:
                    type: [string, "null"]
                externalReference:
                    type: [string, "null"]
                deliveryDate:
                    type: [string, "null"]
                    format: date-time
                    description: A calendar date stored as `@db.Date`, serialised at UTC midnight (`2025-01-01T00:00:00.000Z`).
                deliverySlot:
                    type: [string, "null"]
                beginSearchAt:
                    type: [string, "null"]
                    format: date-time
                endSearchAt:
                    type: [string, "null"]
                    format: date-time
                deliveredAt:
                    type: [string, "null"]
                    format: date-time
                assignedAt:
                    type: [string, "null"]
                    format: date-time
                collectedAt:
                    type: [string, "null"]
                    format: date-time
                requireCollectionProofCode:
                    type: boolean
                requireDeliveryProofCode:
                    type: boolean
                link3rdPartyByContactInfo:
                    type: boolean
                deletedAt:
                    type: [string, "null"]
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                courierMatching:
                    $ref: "#/components/schemas/CourierMatching"
                deliveryFeePayer:
                    $ref: "#/components/schemas/DeliveryFeePayer"
                creatorDeliveryFeeAmount:
                    $ref: "#/components/schemas/ApiDecimalString"
                recipientDeliveryFeeAmount:
                    $ref: "#/components/schemas/ApiDecimalString"
                storePaymentReleased:
                    type: boolean
                courierPaymentReleased:
                    type: boolean
                hubCommission:
                    $ref: "#/components/schemas/ApiDecimalString"
                inputCurrencyCode:
                    type: [string, "null"]
                inputAmount:
                    oneOf:
                        - $ref: "#/components/schemas/ApiDecimalString"
                        - type: "null"
                fxRateUsdToLocal:
                    oneOf:
                        - $ref: "#/components/schemas/ApiDecimalString"
                        - type: "null"
                fxSource:
                    oneOf:
                        - $ref: "#/components/schemas/ApiFxSource"
                        - type: "null"
                fxCapturedAt:
                    type: [string, "null"]
                    format: date-time
                hubCommissionReleased:
                    type: boolean
                hubId:
                    type: [string, "null"]
                    format: uuid
                assignedCourierId:
                    type: [string, "null"]
                    format: uuid
                assignedEmployerCourierId:
                    type: [string, "null"]
                    format: uuid
                fleetTypeId:
                    type: [string, "null"]
                    format: uuid
                userId:
                    type: string
                    format: uuid
                promotionId:
                    type: [string, "null"]
                    format: uuid
                reassignmentId:
                    type: [string, "null"]
                    format: uuid
                apiKeyId:
                    type: [string, "null"]
                    format: uuid
                originId:
                    type: [string, "null"]
                    format: uuid
                destinationId:
                    type: [string, "null"]
                    format: uuid
        ApiDeliveryFeeDisplays:
            type: object
            description: Display fields `decorateP2pDeliveryRequest` adds for each fee column present on the record.
            properties:
                deliveryFeeDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                deliveryFeeTotalDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                serviceFeeDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                discountAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                creatorDeliveryFeeAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                recipientDeliveryFeeAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                hubCommissionDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiDeliveryDetail:
            allOf:
                - $ref: "#/components/schemas/ApiDeliveryRecord"
                - $ref: "#/components/schemas/ApiDeliveryFeeDisplays"
                - type: object
                  required: [origin, destination, proofs, deliverySteps, p2pDelivery, fleetType, deliveryFeeDisplay, deliveryFeeTotalDisplay, serviceFeeDisplay, discountAmountDisplay, creatorDeliveryFeeAmountDisplay, recipientDeliveryFeeAmountDisplay, hubCommissionDisplay]
                  properties:
                      origin:
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/PartnerAddress"
                      destination:
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/PartnerAddress"
                      proofs:
                          type: array
                          description: Not soft-deleted proofs, newest first.
                          items:
                              $ref: "#/components/schemas/ApiDeliveryProof"
                      deliverySteps:
                          type: array
                          description: Visible steps in display order.
                          items:
                              $ref: "#/components/schemas/ApiDeliveryStepView"
                      p2pDelivery:
                          description: Null for order / errand deliveries.
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/ApiP2pDeliveryDetail"
                      fleetType:
                          oneOf:
                              - type: "null"
                              - type: object
                                required: [id, icon, name]
                                properties:
                                    id:
                                        type: string
                                        format: uuid
                                    icon:
                                        type: [string, "null"]
                                    name:
                                        type: string
                      courier:
                          $ref: "#/components/schemas/ApiAssignedCourier"
        # ---------------------------------------------------------------- wallet / checkout
        ApiWallet:
            type: object
            description: The `Wallet` row (every column) plus `balanceDisplay`.
            required: [id, balance, currencyCode, default, status, channel, deletedAt, createdAt, updatedAt, userId, profileId, balanceDisplay]
            properties:
                id:
                    type: string
                    format: uuid
                balance:
                    $ref: "#/components/schemas/ApiDecimalString"
                currencyCode:
                    type: string
                    description: ISO 4217 code of `balance`.
                default:
                    type: boolean
                status:
                    type: string
                    enum: [ACTIVE, INACTIVE, LOCKED]
                channel:
                    type: string
                    const: MERCHANT
                deletedAt:
                    type: "null"
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: string
                    format: uuid
                profileId:
                    type: "null"
                balanceDisplay:
                    description: |
                        `usd` is the balance in USD (rounded to 2 dp). `local` is always set, with `fromSnapshot: false`
                        and no `isStale`; `local.amount` is the raw balance when no `currency` is sent.
                    allOf:
                        - $ref: "#/components/schemas/DisplayMoney"
                        - type: object
                          required: [local]
        ApiPaymentCheckout:
            type: object
            description: Hosted checkout session. Keys whose value is undefined are omitted.
            required: [reference, processor, charge_currency, charge_amount, amount_usd]
            properties:
                authorization_url:
                    type: string
                    format: uri
                    description: Redirect the payer here. Same value as `checkout_url`. May be absent if the processor returned no URL.
                checkout_url:
                    type: string
                    format: uri
                access_code:
                    type: string
                    description: Paystack only.
                reference:
                    type: string
                    description: Waysdrop payment reference (Nomba may return its order reference instead).
                processor:
                    type: string
                    enum: [PAYSTACK, NOMBA, STRIPE]
                charge_currency:
                    type: string
                    description: Currency the processor charges in.
                charge_amount:
                    type: number
                    description: Amount the processor charges, major units (JSON number, float).
                amount_usd:
                    type: number
                    description: USD value credited to the ledger (JSON number, float).
        # ---------------------------------------------------------------- delivery request body
        ApiPayOnDeliveryResult:
            type: object
            required: [enabled, collectAmount, collectTarget, remitTo]
            properties:
                enabled:
                    type: boolean
                    const: true
                collectAmount:
                    type: string
                    description: "Package total in USD as `Number#toString()` (float; may carry noise such as `0.30000000000000004`)."
                collectTarget:
                    type: string
                    const: PACKAGE_VALUE
                remitTo:
                    $ref: "#/components/schemas/PodRemitTo"
                collectAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiPayPackageValueResult:
            type: object
            required: [enabled, amount, paid]
            properties:
                enabled:
                    type: boolean
                    const: true
                amount:
                    $ref: "#/components/schemas/ApiDecimalString"
                paid:
                    type: boolean
                    description: true on WALLET (paid now), false on CHECKOUT.
                amountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiDeliveryWithAddresses:
            allOf:
                - $ref: "#/components/schemas/ApiDeliveryRecord"
                - type: object
                  required: [origin, destination]
                  properties:
                      origin:
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/PartnerAddress"
                      destination:
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/PartnerAddress"
        ApiDeliveryRequestWalletResult:
            description: |
                WALLET create. The created `P2pDelivery` row with its `delivery` (read inside the creating
                transaction: `deliveryNotes`, `externalReference`, `requireCollectionProofCode` and
                `requireDeliveryProofCode` do not yet reflect `note` / `externalReference` / the proof flags you sent).
            allOf:
                - $ref: "#/components/schemas/ApiP2pDeliveryColumns"
                - type: object
                  required: [payPackageValue, delivery, deliveryFee, matchingEligible, totalValueDisplay]
                  properties:
                      payPackageValue:
                          description: The boolean column (false) unless you sent `payPackageValue`, then the object.
                          oneOf:
                              - type: boolean
                              - $ref: "#/components/schemas/ApiPayPackageValueResult"
                      delivery:
                          $ref: "#/components/schemas/ApiDeliveryWithAddresses"
                      deliveryFee:
                          $ref: "#/components/schemas/ApiDeliveryFeeResponsibility"
                      matchingEligible:
                          type: boolean
                      payOnDelivery:
                          $ref: "#/components/schemas/ApiPayOnDeliveryResult"
                      totalValueDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
        ApiDeliveryRequestCheckoutResult:
            description: |
                CHECKOUT create. A hosted checkout for your delivery-fee share (snake_case keys) plus the fee
                split. No delivery id or tracking id is returned.
            allOf:
                - $ref: "#/components/schemas/ApiPaymentCheckout"
                - type: object
                  required: [deliveryFee, matchingEligible, amountUsdDisplay]
                  properties:
                      deliveryFee:
                          $ref: "#/components/schemas/ApiDeliveryFeeResponsibility"
                      matchingEligible:
                          type: boolean
                      payOnDelivery:
                          $ref: "#/components/schemas/ApiPayOnDeliveryResult"
                      payPackageValue:
                          $ref: "#/components/schemas/ApiPayPackageValueResult"
                      amountUsdDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
        ApiDeliveryRequestReplay:
            description: |
                Returned when `externalReference` matches an existing delivery of yours: the stored `Delivery`
                row (no `origin`/`destination` objects, only their ids) with its `p2pDelivery` row. No checkout
                URL and no `*Display` fields.
                Known issue (fix pending): `deliveryFee` is currently serialised as a decimal.js internal object
                (`{"s":1,"e":0,"d":[5]}`), not a string. This schema documents the intended string.
            allOf:
                - $ref: "#/components/schemas/ApiDeliveryRecord"
                - type: object
                  required: [p2pDelivery]
                  properties:
                      p2pDelivery:
                          oneOf:
                              - type: "null"
                              - $ref: "#/components/schemas/ApiP2pDeliveryRecord"
        ApiDeliveryRequestResult:
            description: |
                `ApiDeliveryRequestWalletResult` (has `deliveryId` and `delivery`), `ApiDeliveryRequestCheckoutResult`
                (has `processor` and `amount_usd`), or `ApiDeliveryRequestReplay` (has `trackingId` and `routeType`
                at the top level).
            oneOf:
                - $ref: "#/components/schemas/ApiDeliveryRequestWalletResult"
                - $ref: "#/components/schemas/ApiDeliveryRequestCheckoutResult"
                - $ref: "#/components/schemas/ApiDeliveryRequestReplay"
        ApiCancelDeliveryResult:
            type: object
            required: [delivery]
            properties:
                delivery:
                    type: object
                    required: [id]
                    properties:
                        id:
                            type: string
                            format: uuid
        CommerceMoney:
            description: |
                A commerce amount: the kernel wire format plus an optional display in the viewer's currency.
                At launch `currency` is always `USD` (the catalog pricing currency). Clients show `display.local`
                and never compute totals. `display` is absent on zero placeholders of sessions that have no stored
                pricing.
            allOf:
                - $ref: "#/components/schemas/MoneyWire"
                - type: object
                  properties:
                      display:
                          $ref: "#/components/schemas/CommerceMoneyDisplay"
        CommerceMoneyDisplay:
            type: object
            description: |
                Display-only conversion. Numbers are JSON numbers (floats), never to be used for arithmetic.
                Placed sessions keep the display stored at confirm.
            required: [usd, local]
            properties:
                usd:
                    type: number
                    description: The USD amount in major units.
                local:
                    type: object
                    required: [currency, amount, symbol, fromSnapshot]
                    properties:
                        currency:
                            type: string
                            pattern: "^[A-Z]{3}$"
                            description: The display currency (the `currency` query when honoured, else the account default; USD when no rate is available).
                        amount:
                            type: number
                            description: Major units, rounded half-up to the currency's minor-unit scale.
                        symbol:
                            type: string
                        fromSnapshot:
                            type: boolean
                            description: Always `false` on these routes.
        # ─── Enums ──────────────────────────────────────────────────────────
        CheckoutSessionStatus:
            type: string
            enum: [DRAFT, AWAITING_PAYMENT, PAID, PARTIALLY_CANCELLED, COMPLETED, CANCELLED, EXPIRED]
            description: |
                DRAFT: being edited, re-priced on read and patch. AWAITING_PAYMENT: placed, hosted payment pending.
                PAID: paid, children live. PARTIALLY_CANCELLED: paid, some children cancelled or declined, some
                live. COMPLETED: every live child completed. CANCELLED: every child cancelled or declined.
                EXPIRED: a DRAFT not confirmed before `expiresAt`.
        CheckoutSessionKind:
            type: string
            enum: [CART, BUY_NOW]
        CheckoutUrgency:
            type: string
            enum: [PRIORITY, STANDARD, SCHEDULED]
        CheckoutPaymentMethod:
            type: string
            enum: [WALLET, HOSTED]
        CheckoutPaymentStatus:
            type: string
            enum: [PENDING, SUCCESS, FAILED]
            description: SUCCESS once paid; FAILED when the session is CANCELLED or EXPIRED unpaid; else PENDING.
        CheckoutDeliveryStatus:
            type: string
            enum: [PRICED, NEEDS_ADDRESS, BLOCKED]
            description: |
                PRICED: a delivery quote exists. BLOCKED: delivery pricing refused this route (see the leg's
                `DELIVERY_BLOCKED` issue). NEEDS_ADDRESS: no quote, which the server also reports when the leg is
                excluded, its store is not selling or has no ship-from location, or no line on it is buyable.
        CheckoutLegIssueCode:
            type: string
            enum: [INSUFFICIENT_STOCK, PRODUCT_UNAVAILABLE, STORE_UNAVAILABLE, DELIVERY_BLOCKED, INVALID_OPTIONS]
        CheckoutPromotionKind:
            type: string
            enum: [OFFER, STORE_CODE, PLATFORM_CODE, FREE_DELIVERY]
            description: |
                The welcome gift is never listed in `promotions`; it is reported in `welcomeGift`. FREE_DELIVERY
                rows are server-side roll-ups of free-delivery thresholds, one per funder, with `promotionId: null`.
        CheckoutPromotionTarget:
            type: string
            enum: [ITEM_SUBTOTAL, DELIVERY_FEE, SERVICE_FEE, RETIRED]
            description: RETIRED = a legacy ORDER_TOTAL promotion, reported but never applied (`reason` TARGET_RETIRED).
        CheckoutPromotionFunder:
            type: string
            enum: [PLATFORM, STORE, COURIER]
        CheckoutPromotionNotAppliedReason:
            type: string
            enum: [BELOW_MINIMUM, ABOVE_MAXIMUM, NOT_ELIGIBLE_STORE, NOT_ELIGIBLE_PRODUCT, TARGET_RETIRED, SUPERSEDED, NOTHING_TO_DISCOUNT]
        CheckoutWelcomeGiftIneligibleReason:
            type: string
            enum: [DISABLED, PHONE_UNVERIFIED, NO_ADDRESS, WALLET_NOT_FUNDED, HAS_ORDERS, ALREADY_CLAIMED]
        CheckoutSetupRequirement:
            type: string
            enum: [PHONE_VERIFIED, ADDRESS]
        CheckoutChildOrderStatus:
            type: string
            enum: [PENDING, DECLINED, CANCELLED, CONFIRMED, COMPLETED, PROCESSING, PENDING_PAYMENT]
        CheckoutFreeDeliverySource:
            type: string
            enum: [STORE, PLATFORM_DEFAULT]
        # ─── Requests ───────────────────────────────────────────────────────
        CheckoutCreateRequest:
            type: object
            required: [kind]
            properties:
                kind:
                    $ref: "#/components/schemas/CheckoutSessionKind"
                lineIds:
                    type: array
                    description: CART only (ignored for BUY_NOW). Cart line ids to check out; omit for the whole cart.
                    minItems: 1
                    maxItems: 100
                    items:
                        type: string
                        format: uuid
                items:
                    type: array
                    description: BUY_NOW only (ignored for CART). Required for BUY_NOW; missing or empty is `422 CART_EMPTY`.
                    minItems: 1
                    maxItems: 20
                    items:
                        $ref: "#/components/schemas/CheckoutBuyNowItem"
                addressId:
                    type: string
                    format: uuid
                    description: One of the account's saved addresses. Omitted, the oldest saved address is used.
                attribution:
                    $ref: "#/components/schemas/CheckoutAttribution"
        CheckoutBuyNowItem:
            type: object
            required: [productId, quantity]
            properties:
                productId:
                    type: string
                    format: uuid
                variantId:
                    type: string
                    format: uuid
                    description: Required when the product has variants (else `400 INVALID_VARIANT`).
                options:
                    type: array
                    maxItems: 20
                    items:
                        $ref: "#/components/schemas/CheckoutSelectedOption"
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 999
        CheckoutSelectedOption:
            type: object
            required: [optionId, itemIds]
            properties:
                optionId:
                    type: string
                    format: uuid
                itemIds:
                    type: array
                    maxItems: 20
                    items:
                        type: string
                        format: uuid
        CheckoutAttribution:
            type: object
            properties:
                channelSource:
                    type: string
                    maxLength: 32
                    description: Normalised server-side (lower-cased, `[a-z0-9_-]` only, aliases applied). Empty after normalising = no attribution.
                channelRef:
                    type: string
                    maxLength: 128
                    description: The channel's click id, kept as given (trimmed). Stored only with a `channelSource`.
        CheckoutUpdateRequest:
            type: object
            description: All fields optional. An empty body re-prices and saves the draft.
            properties:
                addressId:
                    type: string
                    format: uuid
                    description: One of the account's saved addresses.
                stores:
                    type: array
                    maxItems: 10
                    items:
                        $ref: "#/components/schemas/CheckoutStorePatch"
                promoCodes:
                    type: array
                    description: Replaces the set. At most 1 platform code and at most 1 store code per store.
                    maxItems: 5
                    items:
                        type: string
                        maxLength: 64
                useWelcomeGift:
                    type: boolean
        CheckoutStorePatch:
            type: object
            required: [storeId]
            properties:
                storeId:
                    type: string
                    format: uuid
                    description: A store in this checkout (`stores[].store.id`).
                included:
                    type: boolean
                    description: false drops this store from the checkout (no order for it). At least one store must stay included.
                fleetTypeId:
                    type: string
                    format: uuid
                    description: An ACTIVE fleet type.
                urgency:
                    $ref: "#/components/schemas/CheckoutUrgency"
                deliveryDate:
                    type: [string, "null"]
                    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
                    description: "YYYY-MM-DD, with `deliverySlot`. `null` clears the schedule (together with `deliverySlot: null`)."
                deliverySlot:
                    type: [string, "null"]
                    maxLength: 32
                    examples: ["10:00-12:00"]
                    description: With `deliveryDate`. At least 1 h long and not yet passed, in the store's time zone.
                deliveryNotes:
                    type: [string, "null"]
                    maxLength: 500
                    description: Empty string or `null` clears the notes.
        CheckoutConfirmRequest:
            type: object
            required: [payment, expectedTotalMinor]
            properties:
                payment:
                    $ref: "#/components/schemas/CheckoutConfirmPayment"
                expectedTotalMinor:
                    type: string
                    pattern: "^(0|[1-9][0-9]{0,17})$"
                    description: The `totals.total.amountMinor` the buyer saw. A different server total is `409 TOTAL_CHANGED`.
        CheckoutConfirmPayment:
            type: object
            required: [method]
            properties:
                method:
                    $ref: "#/components/schemas/CheckoutPaymentMethod"
                payFromWalletId:
                    type: string
                    format: uuid
                    description: WALLET only, needs WALLET_PICKER_V2. One of the wallets `payment-preview` lists.
                expectedNativeMinor:
                    type: string
                    pattern: "^(0|[1-9][0-9]{0,17})$"
                    description: Optional. The preview's `nativeCharge.amountMinor` for `payFromWalletId`; a different native total is `409 TOTAL_CHANGED`. Ignored without `payFromWalletId`.
        # ─── Session view ───────────────────────────────────────────────────
        CheckoutSessionView:
            type: object
            required: [id, kind, status, expiresAt, address, stores, promotions, invalidCodes, welcomeGift, totals, setup, orders, payment]
            properties:
                id:
                    type: string
                    format: uuid
                kind:
                    $ref: "#/components/schemas/CheckoutSessionKind"
                status:
                    $ref: "#/components/schemas/CheckoutSessionStatus"
                expiresAt:
                    type: string
                    format: date-time
                    description: UTC. Meaningful while DRAFT.
                address:
                    oneOf:
                        - $ref: "#/components/schemas/CheckoutAddressSummary"
                        - type: "null"
                stores:
                    type: array
                    description: One leg per store, ordered by store id. Each included leg becomes one child order at confirm.
                    items:
                        $ref: "#/components/schemas/CheckoutStoreLeg"
                promotions:
                    type: array
                    items:
                        $ref: "#/components/schemas/CheckoutAppliedPromotion"
                invalidCodes:
                    type: array
                    description: Codes on the session that did not validate, with the server's human reason.
                    items:
                        $ref: "#/components/schemas/CheckoutInvalidCode"
                welcomeGift:
                    $ref: "#/components/schemas/CheckoutWelcomeGift"
                totals:
                    $ref: "#/components/schemas/CheckoutTotals"
                setup:
                    $ref: "#/components/schemas/CheckoutSetup"
                orders:
                    type: array
                    description: Empty until confirmed.
                    items:
                        $ref: "#/components/schemas/CheckoutChildOrderSummary"
                payment:
                    description: Null until confirmed.
                    oneOf:
                        - $ref: "#/components/schemas/CheckoutPaymentSummary"
                        - type: "null"
        CheckoutAddressSummary:
            type: object
            required: [id, label, addressLine1, area, countryCode, contactName]
            properties:
                id:
                    type: string
                    format: uuid
                label:
                    type: [string, "null"]
                addressLine1:
                    type: string
                area:
                    type: [string, "null"]
                    description: admin3, else admin2, else city, else state.
                countryCode:
                    type: [string, "null"]
                contactName:
                    type: [string, "null"]
        CheckoutStoreSummary:
            type: object
            required: [id, name, tag, logo]
            properties:
                id:
                    type: string
                    description: The store profile id (UUID). For a line whose product no longer exists it is `unknown:<productId>`.
                name:
                    type: string
                    description: "\"Unavailable store\" when the store cannot be loaded."
                tag:
                    type: [string, "null"]
                logo:
                    type: [string, "null"]
        CheckoutStoreLeg:
            type: object
            required: [store, included, lines, delivery, serviceFee, itemsSubtotal, discount, total, issues]
            properties:
                store:
                    $ref: "#/components/schemas/CheckoutStoreSummary"
                included:
                    type: boolean
                    description: false when the buyer dropped this store with PATCH.
                lines:
                    type: array
                    items:
                        $ref: "#/components/schemas/CheckoutLine"
                delivery:
                    $ref: "#/components/schemas/CheckoutLegDelivery"
                serviceFee:
                    $ref: "#/components/schemas/CommerceMoney"
                itemsSubtotal:
                    $ref: "#/components/schemas/CommerceMoney"
                discount:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: Item, delivery and service discounts on this leg.
                total:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: The buyer's total for this leg (0 for an excluded leg).
                issues:
                    type: array
                    items:
                        $ref: "#/components/schemas/CheckoutLegIssue"
        CheckoutLine:
            type: object
            required: [lineKey, productId, variantId, name, quantity, unitPrice, gross, discount, net]
            properties:
                lineKey:
                    type: string
                    description: The cart line id (CART) or `bn-<index>` (BUY_NOW).
                productId:
                    type: string
                    format: uuid
                variantId:
                    type: [string, "null"]
                    format: uuid
                name:
                    type: string
                    description: "\"Unavailable product\" when the product no longer exists."
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 999
                unitPrice:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: Customer price per unit (0 when the line has an issue).
                gross:
                    $ref: "#/components/schemas/CommerceMoney"
                discount:
                    $ref: "#/components/schemas/CommerceMoney"
                net:
                    $ref: "#/components/schemas/CommerceMoney"
        CheckoutLegDelivery:
            type: object
            required: [status, fleetTypeId, urgency, deliveryDate, deliverySlot, deliveryNotes, distanceKm, etaSeconds, fee, feeBeforeDiscount, freeDelivery]
            properties:
                status:
                    $ref: "#/components/schemas/CheckoutDeliveryStatus"
                fleetTypeId:
                    type: [string, "null"]
                    format: uuid
                urgency:
                    $ref: "#/components/schemas/CheckoutUrgency"
                deliveryDate:
                    type: [string, "null"]
                    description: YYYY-MM-DD.
                deliverySlot:
                    type: [string, "null"]
                deliveryNotes:
                    type: [string, "null"]
                distanceKm:
                    type: [number, "null"]
                etaSeconds:
                    type: [number, "null"]
                fee:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: What the buyer pays for delivery on this leg, after free delivery and promotions.
                feeBeforeDiscount:
                    $ref: "#/components/schemas/CommerceMoney"
                freeDelivery:
                    $ref: "#/components/schemas/CheckoutFreeDelivery"
        CheckoutFreeDelivery:
            type: object
            required: [threshold, source, remaining, qualified, progressBps]
            properties:
                threshold:
                    oneOf:
                        - $ref: "#/components/schemas/CommerceMoney"
                        - type: "null"
                source:
                    oneOf:
                        - $ref: "#/components/schemas/CheckoutFreeDeliverySource"
                        - type: "null"
                remaining:
                    $ref: "#/components/schemas/CommerceMoney"
                qualified:
                    type: boolean
                progressBps:
                    type: integer
                    minimum: 0
                    maximum: 10000
                    description: Progress towards the threshold in basis points.
        CheckoutLegIssue:
            type: object
            required: [code, message]
            properties:
                code:
                    $ref: "#/components/schemas/CheckoutLegIssueCode"
                lineKey:
                    type: string
                    description: Present for line issues; absent for DELIVERY_BLOCKED.
                available:
                    type: integer
                    description: Present when the catalog reported the available quantity (INSUFFICIENT_STOCK).
                message:
                    type: string
                    description: Human text; branch on `code`.
        CheckoutAppliedPromotion:
            type: object
            required: [promotionId, code, kind, target, funder, applied, amount, storeIds]
            description: |
                Codes and offers considered, with the result. Offers that did not apply are omitted. `amount` is
                the sum of this promotion's allocations (what its funder pays).
            properties:
                promotionId:
                    type: [string, "null"]
                    description: Null for FREE_DELIVERY roll-ups.
                code:
                    type: [string, "null"]
                kind:
                    $ref: "#/components/schemas/CheckoutPromotionKind"
                target:
                    $ref: "#/components/schemas/CheckoutPromotionTarget"
                funder:
                    $ref: "#/components/schemas/CheckoutPromotionFunder"
                applied:
                    type: boolean
                amount:
                    $ref: "#/components/schemas/CommerceMoney"
                reason:
                    $ref: "#/components/schemas/CheckoutPromotionNotAppliedReason"
                    description: Present only when `applied` is false.
                storeIds:
                    type: array
                    description: Store legs it touched.
                    items:
                        type: string
        CheckoutInvalidCode:
            type: object
            required: [code, reason]
            properties:
                code:
                    type: string
                    description: The promo code as typed.
                reason:
                    type: string
                    description: Human reason from the server (free text).
        CheckoutWelcomeGift:
            type: object
            required: [eligible, applied, amount]
            properties:
                eligible:
                    type: boolean
                    description: false also when `useWelcomeGift` is off (the gift is then not evaluated and `reason` is absent).
                applied:
                    type: boolean
                amount:
                    oneOf:
                        - $ref: "#/components/schemas/CommerceMoney"
                        - type: "null"
                reason:
                    $ref: "#/components/schemas/CheckoutWelcomeGiftIneligibleReason"
                    description: Present only when the gift was evaluated and is not eligible.
        CheckoutTotals:
            type: object
            required: [itemsSubtotal, discount, delivery, serviceFee, total]
            properties:
                itemsSubtotal:
                    $ref: "#/components/schemas/CommerceMoney"
                discount:
                    $ref: "#/components/schemas/CommerceMoney"
                delivery:
                    $ref: "#/components/schemas/CommerceMoney"
                serviceFee:
                    $ref: "#/components/schemas/CommerceMoney"
                total:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: Send `total.amountMinor` back as `expectedTotalMinor` on confirm.
        CheckoutSetup:
            type: object
            required: [canTransact, missing]
            description: "The setup gate checked at confirm. Placed sessions and list items always report `{ canTransact: true, missing: [] }`."
            properties:
                canTransact:
                    type: boolean
                missing:
                    type: array
                    items:
                        $ref: "#/components/schemas/CheckoutSetupRequirement"
        CheckoutChildOrderSummary:
            type: object
            required: [orderId, orderNumber, storeId, status, trackingId, total]
            properties:
                orderId:
                    type: string
                    format: uuid
                orderNumber:
                    type: string
                storeId:
                    type: string
                    format: uuid
                status:
                    $ref: "#/components/schemas/CheckoutChildOrderStatus"
                trackingId:
                    type: [string, "null"]
                total:
                    $ref: "#/components/schemas/CommerceMoney"
        CheckoutPaymentSummary:
            type: object
            required: [method, status, reference, amount, nativeCharge, walletId]
            properties:
                method:
                    $ref: "#/components/schemas/CheckoutPaymentMethod"
                status:
                    $ref: "#/components/schemas/CheckoutPaymentStatus"
                reference:
                    type: string
                amount:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: USD ledger total (the session total).
                nativeCharge:
                    description: What left the picked wallet, in its currency. Null for pooled, hosted and zero-total payments.
                    oneOf:
                        - $ref: "#/components/schemas/MoneyWire"
                        - type: "null"
                hosted:
                    $ref: "#/components/schemas/CheckoutHostedPayment"
                walletId:
                    type: [string, "null"]
                    format: uuid
                    description: The picked wallet; null when pooled or not a wallet payment.
        CheckoutHostedPayment:
            type: object
            description: Present only once a HOSTED provider checkout was started.
            required: [checkoutUrl, accessCode, processor, chargeCurrency, chargeAmount]
            properties:
                checkoutUrl:
                    type: [string, "null"]
                accessCode:
                    type: [string, "null"]
                processor:
                    type: string
                    description: Today PAYSTACK, NOMBA or STRIPE.
                chargeCurrency:
                    type: string
                chargeAmount:
                    type: string
                    description: The provider charge in MAJOR units as a decimal string, stringified from a JS number (not minor units, not MoneyWire).
        CheckoutSessionPage:
            type: object
            required: [items, page]
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/CheckoutSessionView"
                page:
                    $ref: "#/components/schemas/PageInfo"
        # ─── Payment preview ────────────────────────────────────────────────
        CheckoutPaymentPreview:
            type: object
            required: [total, fxLockedUntil, recommendedWalletId, wallets, pooled]
            properties:
                total:
                    $ref: "#/components/schemas/CommerceMoney"
                    description: The session total (USD).
                fxLockedUntil:
                    type: string
                    format: date-time
                    description: Now + 10 min. Returned even when no wallet was available to lock.
                recommendedWalletId:
                    type: [string, "null"]
                    format: uuid
                    description: The home-currency wallet if it covers the total, else the funded wallet with the highest USD value (ties to the smaller id); null when no wallet holds anything.
                wallets:
                    type: array
                    description: Ordered by wallet id.
                    items:
                        $ref: "#/components/schemas/CheckoutPaymentPreviewWallet"
                pooled:
                    type: object
                    required: [sufficient]
                    properties:
                        sufficient:
                            type: boolean
                            description: Whether paying without `payFromWalletId` (pooled across wallets) covers the total.
        CheckoutPaymentPreviewWallet:
            type: object
            required: [walletId, currency, balance, nativeCharge, sufficient, isHome]
            properties:
                walletId:
                    type: string
                    format: uuid
                currency:
                    type: string
                balance:
                    $ref: "#/components/schemas/MoneyWire"
                    description: In the wallet's currency; a non-positive balance reads as 0.
                nativeCharge:
                    $ref: "#/components/schemas/MoneyWire"
                    description: Exactly what confirm debits from this wallet (at the locked rate for the locked currency).
                sufficient:
                    type: boolean
                isHome:
                    type: boolean
        # ─── Confirm and cancel ─────────────────────────────────────────────
        CheckoutConfirmResult:
            type: object
            required: [sessionId, status, orders, payment]
            properties:
                sessionId:
                    type: string
                    format: uuid
                status:
                    $ref: "#/components/schemas/CheckoutSessionStatus"
                    description: PAID for a wallet (or zero-total) payment, AWAITING_PAYMENT for hosted. A replay reports the current status.
                orders:
                    type: array
                    description: One per included store, oldest first. Children start PENDING (wallet) or PENDING_PAYMENT (hosted).
                    items:
                        $ref: "#/components/schemas/CheckoutChildOrderSummary"
                payment:
                    description: Typed nullable by the server; always present after a successful confirm.
                    oneOf:
                        - $ref: "#/components/schemas/CheckoutPaymentSummary"
                        - type: "null"
        CheckoutStockShortfall:
            type: object
            description: "Item of `details.stores` on `409 INSUFFICIENT_STOCK` from confirm."
            required: [storeId, lines]
            properties:
                storeId:
                    type: string
                    description: Store profile id (`unknown` when the product's store could not be mapped).
                lines:
                    type: array
                    items:
                        type: object
                        required: [productId, variantId, requested, available]
                        properties:
                            productId:
                                type: [string, "null"]
                            variantId:
                                type: [string, "null"]
                            requested:
                                type: integer
                            available:
                                type: integer
        OrderCancelResult:
            type: object
            required: [orderId, status, refund, session]
            properties:
                orderId:
                    type: string
                    format: uuid
                status:
                    const: CANCELLED
                refund:
                    description: Total refunded on this order's successful payments after the cancel; null when nothing was paid.
                    oneOf:
                        - $ref: "#/components/schemas/CommerceMoney"
                        - type: "null"
                session:
                    $ref: "#/components/schemas/CheckoutSessionView"
        WebhookApiVersion:
            type: string
            enum:
                - "2026-11-25"
            description: Webhook payload API version (pins the envelope and object shapes).
        WebhookObjectKind:
            type: string
            enum:
                - delivery
                - delivery_stop
                - delivery_plan
                - order
                - checkout_session
                - payment
                - ping
            description: The `data.object.object` kind an event type carries.
        WebhookEventCatalogueEntry:
            type: object
            required:
                - type
                - object
                - description
            properties:
                type:
                    $ref: "#/components/schemas/WebhookEventType"
                object:
                    $ref: "#/components/schemas/WebhookObjectKind"
                description:
                    type: string
        WebhookEventCatalogue:
            type: object
            required:
                - apiVersions
                - types
            properties:
                apiVersions:
                    type: array
                    items:
                        $ref: "#/components/schemas/WebhookApiVersion"
                    minItems: 1
                types:
                    type: array
                    items:
                        $ref: "#/components/schemas/WebhookEventCatalogueEntry"
                    description: Every catalogue type (24, including `ping`), in catalogue order.
        WebhookEndpointEnabledEvent:
            type: string
            maxLength: 64
            anyOf:
                -   const: "*"
                -   $ref: "#/components/schemas/WebhookEventType"
            description: "`*` (every event, now and future) or a catalogue type. `ping` is in the catalogue but can never be subscribed to (422 WEBHOOK_EVENT_TYPE_UNKNOWN). On input the server trims each entry, removes duplicates and sorts; if `*` is present the list becomes `[\"*\"]` and the other entries are ignored, even unknown ones."
        WebhookEndpointFormat:
            type: string
            enum:
                - v2
                - legacy
            description: "`v2`: the signed envelope (contract §1). `legacy`: today's `{event, data}` body signed with the API secret key; only for endpoints migrated from an API key's webhook URL, bound to that key."
        WebhookEndpointStatus:
            type: string
            enum:
                - enabled
                - disabled
        WebhookEndpointDisabledReason:
            type: string
            enum:
                - manual
                - gone
                - failing
            description: "`manual`: by the partner (PATCH, DELETE, or clearing the old dashboard URL). `gone`: the endpoint answered 410. `failing`: no 2xx for 3 days."
        WebhookEndpointUrlInvalidReason:
            type: string
            enum:
                - MALFORMED
                - NOT_HTTPS
                - CREDENTIALS_IN_URL
                - HOST_NOT_ALLOWED
                - PORT_NOT_ALLOWED
                - TOO_LONG
            description: "`details.reason` of 422 WEBHOOK_URL_INVALID. `HOST_NOT_ALLOWED`: an IP literal in a refused range, `localhost`, a single-label host, or a host ending in `.localhost`, `.local`, `.internal`, `.localdomain`, `.home.arpa`. `PORT_NOT_ALLOWED`: an explicit port other than 443 or 1024-65535. `TOO_LONG` (> 2048 chars) cannot surface through this API (the DTO answers 400 first)."
        WebhookEndpointSigningSecret:
            type: string
            pattern: ^whsec_[A-Za-z0-9_-]{43}$
            minLength: 49
            maxLength: 49
            description: "The endpoint signing secret: `whsec_` + base64url (no padding) of 32 random bytes. Shown only in the create, rotate and (legacy → v2) update responses; store it then."
        WebhookEndpointSecretInfo:
            type: object
            required:
                - prefix
                - createdAt
                - previousExpiresAt
            properties:
                prefix:
                    type: string
                    pattern: ^whsec_[A-Za-z0-9_-]{4}$
                    description: First 10 characters of the current secret (`whsec_` + 4).
                createdAt:
                    type: string
                    format: date-time
                    description: When the current secret was minted.
                previousExpiresAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: Until when the previous secret still signs; `null` when there is none or it has already expired (computed at read time).
            description: Metadata of the signing secret. Never the secret itself.
        WebhookEndpointView:
            type: object
            required:
                - id
                - url
                - description
                - enabledEvents
                - apiVersion
                - format
                - status
                - disabledReason
                - disabledAt
                - livemode
                - apiKeyId
                - secret
                - failingSince
                - lastSuccessAt
                - createdAt
                - updatedAt
            properties:
                id:
                    type: string
                    format: uuid
                    description: UUIDv7.
                url:
                    type: string
                    description: Normalised by the URL parser on create/update. A legacy endpoint's URL can also be set from the old API-key settings screen without the create-time checks (for example `http://`); such URLs are refused at send time (`URL_REFUSED`).
                description:
                    type:
                        - string
                        - "null"
                    maxLength: 280
                enabledEvents:
                    type: array
                    items:
                        $ref: "#/components/schemas/WebhookEndpointEnabledEvent"
                    minItems: 1
                    description: "`[\"*\"]` or distinct catalogue types, sorted. Always `[\"*\"]` for legacy endpoints."
                apiVersion:
                    $ref: "#/components/schemas/WebhookApiVersion"
                format:
                    $ref: "#/components/schemas/WebhookEndpointFormat"
                status:
                    $ref: "#/components/schemas/WebhookEndpointStatus"
                disabledReason:
                    oneOf:
                        -   $ref: "#/components/schemas/WebhookEndpointDisabledReason"
                        -   type: "null"
                disabledAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When it was last disabled; `null` while enabled.
                livemode:
                    type: boolean
                    description: "`true` on the live API (`ENV=live`), `false` on every other deployment. Endpoints are scoped to the mode they were created in; there are no test keys."
                apiKeyId:
                    type:
                        - string
                        - "null"
                    format: uuid
                    description: The API key a legacy endpoint is bound to. Always `null` for `v2` endpoints (also after a legacy endpoint is switched to v2).
                secret:
                    oneOf:
                        -   $ref: "#/components/schemas/WebhookEndpointSecretInfo"
                        -   type: "null"
                    description: "`null` for a legacy endpoint that has never had a `whsec_` secret."
                failingSince:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: Start of the current run of failed attempts; cleared by any 2xx. After 3 days the endpoint is disabled with `failing`.
                lastSuccessAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: Last 2xx response.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        WebhookEndpointCreateRequest:
            type: object
            required:
                - url
                - enabledEvents
            properties:
                url:
                    type: string
                    format: uri
                    minLength: 1
                    maxLength: 2048
                    description: "@IsString @MaxLength(2048) (an empty string is treated as missing). Then the SSRF rules (422 WEBHOOK_URL_INVALID): `https` only, no credentials, port 443 or 1024-65535, no refused IP literal or local-only host. Leading/trailing spaces are trimmed. DNS is checked at send time, not here."
                description:
                    type: string
                    maxLength: 280
                    description: "@IsOptional @IsString @MaxLength(280). Trimmed; an empty or whitespace-only value is stored as `null`."
                enabledEvents:
                    type: array
                    minItems: 1
                    maxItems: 40
                    items:
                        $ref: "#/components/schemas/WebhookEndpointEnabledEvent"
                    description: "@IsArray @ArrayMinSize(1) @ArrayMaxSize(40), each @IsString @MaxLength(64). Then checked against the catalogue (422)."
                apiVersion:
                    $ref: "#/components/schemas/WebhookApiVersion"
                    default: "2026-11-25"
                    description: "@IsOptional @IsIn(WEBHOOK_API_VERSIONS): an unknown value is 400 VALIDATION_FAILED."
                format:
                    type: string
                    enum:
                        - v2
                    default: v2
                    description: "@IsOptional @IsIn(['v2']). Accepted for symmetry and ignored: new endpoints are always `v2`."
            description: "Unknown properties are silently dropped (global ValidationPipe `whitelist: true` without `forbidNonWhitelisted`)."
        WebhookEndpointUpdateRequest:
            type: object
            properties:
                url:
                    type: string
                    format: uri
                    minLength: 1
                    maxLength: 2048
                    description: Same rules as on create. `null` is 422 WEBHOOK_URL_INVALID (`MALFORMED`).
                description:
                    type: string
                    maxLength: 280
                    description: Trimmed; whitespace-only clears it to `null`. An empty string `""` is treated as omitted (the global pipe turns top-level `""` into undefined), so it does NOT clear. `null` crashes (500, bug).
                enabledEvents:
                    type: array
                    minItems: 1
                    maxItems: 40
                    items:
                        $ref: "#/components/schemas/WebhookEndpointEnabledEvent"
                    description: "Replaces the subscription. Refused on a legacy endpoint (409 WEBHOOK_LEGACY_EVENTS_FIXED) unless `format: \"v2\"` is sent in the same request. `null` crashes (500, bug)."
                apiVersion:
                    $ref: "#/components/schemas/WebhookApiVersion"
                    description: "Unknown value: 400 VALIDATION_FAILED. `null` crashes (500, bug)."
                format:
                    $ref: "#/components/schemas/WebhookEndpointFormat"
                    description: "`v2` on a legacy endpoint switches it (one way). `legacy` is only accepted on an endpoint that is already legacy (a no-op); otherwise 409 WEBHOOK_FORMAT_LEGACY_ONLY."
                status:
                    $ref: "#/components/schemas/WebhookEndpointStatus"
                    description: Setting the current status again is a no-op (no new `disabledAt`).
            description: All properties optional; `{}` is accepted and only bumps `updatedAt`. Unknown properties are silently dropped. Never send `null` for `description`, `enabledEvents` or `apiVersion` (500, bug).
        WebhookEndpointCreateResult:
            type: object
            required:
                - endpoint
                - secret
            properties:
                endpoint:
                    $ref: "#/components/schemas/WebhookEndpointView"
                secret:
                    $ref: "#/components/schemas/WebhookEndpointSigningSecret"
        WebhookEndpointUpdateResult:
            type: object
            required:
                - endpoint
            properties:
                endpoint:
                    $ref: "#/components/schemas/WebhookEndpointView"
                secret:
                    $ref: "#/components/schemas/WebhookEndpointSigningSecret"
                    description: Present only when this request switched a legacy endpoint that had no `whsec_` secret to `v2`. The only time it is shown.
        WebhookEndpointList:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    maxItems: 32
                    items:
                        $ref: "#/components/schemas/WebhookEndpointView"
                    description: Newest first. Not paginated (see the operation description).
        WebhookEndpointDeleteResult:
            type: object
            required:
                - id
                - deleted
            properties:
                id:
                    type: string
                    format: uuid
                deleted:
                    const: true
        WebhookEndpointRotateSecretRequest:
            type: object
            properties:
                expiresInSeconds:
                    type: integer
                    minimum: 0
                    maximum: 604800
                    default: 86400
                    description: "@IsOptional @Type(() => Number) @IsInt @Min(0) @Max(604800). How long the current secret keeps signing as the previous one. `0` stops it now. A numeric string is coerced."
        WebhookEndpointRotateSecretResult:
            type: object
            required:
                - secret
                - previousExpiresAt
            properties:
                secret:
                    $ref: "#/components/schemas/WebhookEndpointSigningSecret"
                previousExpiresAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When the previous secret stops signing; `null` when `expiresInSeconds` was 0 or the endpoint had no secret before.
        WebhookEndpointPingResult:
            type: object
            required:
                - eventId
                - deliveryId
            properties:
                eventId:
                    $ref: "#/components/schemas/WebhookEventId"
                deliveryId:
                    type: string
                    format: uuid
                    description: Poll `GET /v2/webhooks/deliveries/{deliveryId}`.
        WebhookEndpointReplayRequest:
            type: object
            required:
                - from
                - to
            properties:
                from:
                    type: string
                    format: date-time
                    description: "Inclusive. @IsISO8601({strict: true}): any ISO 8601 form validator.js accepts passes validation (date-only too, read as UTC midnight); send a full UTC date-time. Must be within the last 30 days."
                to:
                    type: string
                    format: date-time
                    description: Exclusive. Same format rule. `to - from` at most 7 days. May be in the future.
                types:
                    type: array
                    maxItems: 40
                    items:
                        $ref: "#/components/schemas/WebhookEndpointEnabledEvent"
                    description: "@IsOptional @IsArray @ArrayMaxSize(40), each @IsString @MaxLength(64). Narrows a v2 endpoint's replay to these types (still intersected with its subscription). Omitted, `[]` or `[\"*\"]`: every subscribed type. Ignored for legacy endpoints."
            description: Unknown properties are silently dropped.
        WebhookEndpointReplayResult:
            type: object
            required:
                - queued
                - nextFrom
            properties:
                queued:
                    type: integer
                    minimum: 0
                    maximum: 500
                    description: Deliveries created plus finished deliveries reset to pending by this call.
                nextFrom:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: "When more than 500 events are in range: the `createdAt` of the first one not examined. Call again with `from = nextFrom`. `null` when done."
        WebhookEventId:
            type: string
            pattern: ^evt_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            description: "Partner-facing event id: `evt_` + the outbox event UUID (v7). Same as the envelope `id` and the `Waysdrop-Event-Id` header."
            examples:
                - evt_0193b2f4-1c2d-7a3b-9c4d-5e6f7a8b9c0d
        WebhookDeliveryStatus:
            type: string
            enum:
                - pending
                - sending
                - succeeded
                - failed
                - cancelled
            description: "`sending`: an attempt holds a 60 s lease. `failed`: final (deadline or 40 attempts reached, a `final` error, or 410). `cancelled`: the endpoint was disabled or deleted while it was pending."
        WebhookDeliveryErrorCode:
            type: string
            enum:
                - TIMEOUT
                - CONNECTION_FAILED
                - DNS_FAILED
                - TLS_FAILED
                - URL_REFUSED
                - HTTP_STATUS
                - REDIRECT_NOT_FOLLOWED
                - API_KEY_INACTIVE
                - NOT_A_LEGACY_EVENT
                - NOT_A_V2_EVENT
                - INTERNAL_ERROR
                - ENDPOINT_DISABLED
            description: "Values the server writes to `WebhookDeliveryView.errorCode` today. Treat as an open set (tolerate unknown values). `HTTP_STATUS`: a non-2xx, non-3xx response (see `responseStatus`; 410 also disables the endpoint). `URL_REFUSED`, `API_KEY_INACTIVE`, `NOT_A_LEGACY_EVENT`, `NOT_A_V2_EVENT`: final at once. `INTERNAL_ERROR`: the request could not be built on our side (retried). `ENDPOINT_DISABLED`: cancelled because the endpoint was disabled or deleted. There is no `DEADLINE_EXCEEDED`: a delivery that runs out of time keeps its last attempt's code. SDKs: open set (generate constants, keep the raw string)."
        WebhookDeliveryView:
            type: object
            required:
                - id
                - endpointId
                - eventId
                - eventType
                - status
                - attempts
                - nextAttemptAt
                - lastAttemptAt
                - deadlineAt
                - responseStatus
                - latencyMs
                - errorCode
                - responseBody
                - createdAt
                - updatedAt
            properties:
                id:
                    type: string
                    format: uuid
                    description: UUIDv7. Same as the `Waysdrop-Delivery-Id` header (v2) / `X-Webhook-Log-Id` (legacy); stable across retries.
                endpointId:
                    type: string
                    format: uuid
                eventId:
                    $ref: "#/components/schemas/WebhookEventId"
                eventType:
                    type: string
                    description: A catalogue type for v2 endpoints (and `ping`); the legacy event name (e.g. `p2p.delivery.created`) for legacy endpoints.
                status:
                    $ref: "#/components/schemas/WebhookDeliveryStatus"
                attempts:
                    type: integer
                    minimum: 0
                    description: Attempts made so far (never reset by resend or replay).
                nextAttemptAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: When the next attempt is due; only set while `pending`.
                lastAttemptAt:
                    type:
                        - string
                        - "null"
                    format: date-time
                    description: Start of the last attempt.
                deadlineAt:
                    type: string
                    format: date-time
                    description: No retry is scheduled after this (3 days from creation, resend or replay).
                responseStatus:
                    type:
                        - integer
                        - "null"
                    description: HTTP status of the last response; `null` when there was none.
                latencyMs:
                    type:
                        - integer
                        - "null"
                    minimum: 0
                errorCode:
                    type:
                        - string
                        - "null"
                    description: Why the last attempt did not succeed (see `WebhookDeliveryErrorCode`); `null` after a success, resend or replay reset.
                responseBody:
                    type:
                        - string
                        - "null"
                    maxLength: 1024
                    description: First 1024 bytes of the last response body, decoded as UTF-8 (lossy at the cut).
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        WebhookDeliveryDetail:
            allOf:
                -   $ref: "#/components/schemas/WebhookDeliveryView"
                -   type: object
                    required:
                        - request
                    properties:
                        request:
                            type: object
                            required:
                                - body
                            properties:
                                body:
                                    type:
                                        - string
                                        - "null"
                                    description: The exact bytes last sent (verify signatures against this). `null` until the first attempt is recorded.
