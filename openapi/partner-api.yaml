                            const: false
                        collectAmount:
                            type: string
                            description: "`totalValue` (USD) as `Number#toString()` (may carry float noise)."
                        collectTarget:
                            type: string
                            const: PACKAGE_VALUE
                        collectAmountDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
        ApiPricingResult:
