                        delivery:
                            $ref: "#/components/schemas/ApiDecimalString"
                        serviceFee:
                            $ref: "#/components/schemas/ApiDecimalString"
                        hubCommission:
                            $ref: "#/components/schemas/ApiDecimalString"
                        bundledTotal:
                            $ref: "#/components/schemas/ApiDecimalString"
                creator:
                    $ref: "#/components/schemas/ApiFeeShareParty"
                recipient:
                    $ref: "#/components/schemas/ApiFeeShareParty"
                promotion:
                    $ref: "#/components/schemas/ApiFeeSharePromotion"
                matchingBlockedUntil:
                    type: string
                    enum: [CREATOR, RECIPIENT, BOTH, NONE]
                matchingEligible:
                    type: boolean
        ApiDeliveryFeeResponsibility:
            type: object
