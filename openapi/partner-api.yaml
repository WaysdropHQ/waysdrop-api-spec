            summary: Resend a webhook delivery
            description: |-
                Sets the delivery back to `pending` now with a fresh 3-day deadline and clears its `errorCode`, whatever its status except `sending`. The original event (same `id`, `sequence`, body) is re-sent, signed with the current secret(s) and a new timestamp. No request body. Note: `attempts` is not reset, so `Waysdrop-Delivery-Attempt` keeps counting and a delivery that already made 40 attempts gets exactly one more, and retries resume at the 6-hour spacing rather than starting from 1 minute.

                Auth: secret API key (`api-key: wsp_live_…` / `wsp_staging_…`), a first-party Bearer JWT, or the api-dashboard web session cookie with the CSRF header. Public keys and third-party OAuth tokens are refused.
                Rate limit: 30 requests per 60 s.

                Errors (problem details; `code` also in `details.code`). Evaluation order: route throttle, auth, feature flag, path and body validation, then the handler checks in the order listed:
                - `400 BAD_REQUEST`: `{id}` is not a UUID (ParseUUIDPipe, message "Validation failed (uuid is expected)"). `details`: `code`.
                - `401 UNAUTHENTICATED`: no credential; an `api-key` that is not `wsp_(live|staging)_<64 hex>` (every public key `wsp_pub_…` lands here); an unknown key; caller IP not in the key's `allowedIps`; an invalid, expired or revoked JWT. `details`: `code`.
                - `402 HTTP_402`: API-key callers only: the account is blocked for unpaid API usage (wallet balance below the usage debt). The code is the kernel default for an unmapped status. `details`: `code`.
                - `403 FORBIDDEN`: API key inactive or expired, or its account not ACTIVE; a secret key sent from a browser; banned account; a third-party OAuth access token (`cid` claim; no route here has @OAuthScopes). `details`: `code`.
                - `403 CSRF_REJECTED`: web session cookie callers only (api-dashboard), when the CSRF/origin check fails. `details`: `code`, `reason`.
                - `404 NOT_FOUND`: JWT callers only: the token's user no longer exists. `details`: `code`.
                - `404 FEATURE_DISABLED`: `PARTNER_WEBHOOKS_V2` is off for the authenticated account. `details`: `code`.
                - `404 WEBHOOK_DELIVERY_NOT_FOUND`: no delivery with this id for the caller's account whose endpoint is in the current mode and not deleted. `details`: `code`.
                - `409 WEBHOOK_ENDPOINT_DISABLED`: the endpoint is disabled; enable it first. `details`: `code`.
                - `409 WEBHOOK_DELIVERY_IN_FLIGHT`: the delivery is `sending` right now (also while a crashed attempt's lease has not been re-claimed). `details`: `code`.
                - `429 RATE_LIMITED`: route throttle exceeded (see `x-rate-limit`; `details`: `code`), or the API key's quota is exhausted (`details`: `code`, `quota{limit, remaining, resetAt, resetIn}`).
                - `500 INTERNAL_ERROR`: unexpected server error. `details`: `code`.
            security:
                -   ApiKeyAuth: []
            x-feature-flag: PARTNER_WEBHOOKS_V2
            x-bearer-only: false
            x-rate-limit:
                limit: 30
                windowSeconds: 60
                scope: Per route. Keyed on the verified JWT subject (Bearer or web session cookie); otherwise on the client IP, so API-key callers are keyed by IP, not by key or account. Exceeding it answers 429 RATE_LIMITED with Retry-After and X-RateLimit-Limit/Remaining/Reset headers.
            responses:
                "200":
                    description: The delivery, now pending.
                    content:
                        application/json:
                            schema:
                                type: object
                                required:
                                    - success
                                    - data
                                properties:
                                    success:
                                        const: true
                                    data:
                                        $ref: "#/components/schemas/WebhookDeliveryView"
                "400":
                    $ref: "#/components/responses/Problem"
                "401":
                    $ref: "#/components/responses/Problem"
                "402":
                    $ref: "#/components/responses/Problem"
                "403":
                    $ref: "#/components/responses/Problem"
                "404":
                    $ref: "#/components/responses/Problem"
                "409":
                    $ref: "#/components/responses/Problem"
                "429":
                    $ref: "#/components/responses/Problem"
                "500":
                    $ref: "#/components/responses/Problem"
components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: api-key
            description: |
                Secret key `wsp_live_…` / `wsp_staging_…` (64 lowercase hex characters after the
                prefix). Server-side only: refused from browsers.
        PublicApiKeyAuth:
            type: apiKey
            in: header
            name: api-key
            description: |
                Public key `wsp_pub_live_…` / `wsp_pub_staging_…`. Browser-safe; accepted only on
                operations that list this scheme. Optional allowed-origins list per key.
    parameters:
        SearchQuery:
            name: search
            in: query
            schema:
                type: string
        LimitQuery:
            name: limit
            in: query
            schema:
                type: integer
        DisplayCurrencyQuery:
            name: currency
            in: query
            description: ISO 4217 override for display money (`*Display` fields, `DisplayMoney.local`)
            schema:
                type: string
                minLength: 3
                maxLength: 3
                example: NGN
        IdempotencyKey:
            name: Idempotency-Key
            in: header
            required: true
            description: |
                Required. A new value (UUID recommended) per user action, reused on every retry of
                that action. Scoped to the account and the API key; replayed for 24 h.
            schema:
                type: string
                pattern: "^[A-Za-z0-9_.:-]{1,255}$"
        IdempotencyKeyOptional:
            name: Idempotency-Key
            in: header
            required: false
            description: Optional; when sent, the request is deduplicated exactly like a required key.
            schema:
                type: string
                pattern: "^[A-Za-z0-9_.:-]{1,255}$"
        PageLimit:
            name: limit
            in: query
            required: false
            description: Page size, 1–50 (default 20). Above 50 is 400 `VALIDATION_FAILED`.
            schema:
                type: integer
                minimum: 1
                maximum: 50
                default: 20
        PageCursor:
            name: cursor
            in: query
            required: false
            description: |
                Opaque cursor from `page.nextCursor` of the previous page; omit for the first page.
                Valid only with the same filters and sort. A malformed or tampered cursor is 400
                `INVALID_CURSOR`.
            schema:
                type: string
                maxLength: 512
                pattern: "^[A-Za-z0-9_-]+$"
        CheckoutSessionIdPath:
            name: id
            in: path
            required: true
            description: Checkout session id. A non-UUID is `400 BAD_REQUEST`.
            schema:
                type: string
                format: uuid
        OrderIdPath:
            name: orderId
            in: path
            required: true
            description: Child order id (from `orders[].orderId`). A non-UUID is `400 BAD_REQUEST`.
            schema:
                type: string
                format: uuid
        CheckoutSessionStatusQuery:
            name: status
            in: query
            required: false
            description: Only sessions in this status. Omitted, DRAFT and EXPIRED are excluded.
            schema:
                $ref: "#/components/schemas/CheckoutSessionStatus"
        CheckoutDeviceIdHeader:
            name: X-Device-Id
            in: header
            required: false
            description: |
                A stable device id, used only as a keyed hash for the one-welcome-gift-per-device rule. A value
                that does not match the pattern is ignored (treated as absent), never rejected.
            schema:
                type: string
                pattern: "^[A-Za-z0-9._:-]{8,128}$"
    headers:
        IdempotentReplayed:
            description: "`true` when this response is a stored replay of an earlier request with the same `Idempotency-Key`."
            schema:
                type: string
                enum: ["true"]
        RetryAfter:
            description: Seconds to wait before retrying.
            schema:
                type: integer
                minimum: 0
        XCorrelationId:
            description: Request correlation id (yours if you sent a valid `X-Correlation-Id` / `X-Request-Id`).
            schema:
                type: string
        XRateLimitLimit:
            description: Requests allowed in the current window (global throttle).
            schema:
                type: integer
        XRateLimitRemaining:
            description: Requests left in the current window.
            schema:
                type: integer
        XRateLimitReset:
            description: Seconds until the window resets.
            schema:
                type: integer
    responses:
        SuccessEnvelope:
            description: Success (legacy `/api/*` envelope)
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ApiSuccessResponse"
        ErrorEnvelope:
            description: Error (legacy `/api/*` body). Read `details.code` when present.
            headers:
                X-Correlation-Id:
                    $ref: "#/components/headers/XCorrelationId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ApiErrorResponse"
        TooManyRequests:
            description: |
                Rate limited (`/api/*` legacy body). Global throttle: `Retry-After` header. Quota:
                `details.quota` (`QuotaExceededDetails`). Public key: plain message.
            headers:
                Retry-After:
                    $ref: "#/components/headers/RetryAfter"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ApiErrorResponse"
        Problem:
            description: Error (`/v2` problem details). Switch on `code`.
            headers:
                X-Correlation-Id:
                    $ref: "#/components/headers/XCorrelationId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Problem"
        ProblemRetryable:
            description: |
                Error with `Retry-After` (409 `IDEMPOTENCY_REQUEST_IN_PROGRESS`, 429 `RATE_LIMITED`).
            headers:
                Retry-After:
                    $ref: "#/components/headers/RetryAfter"
                X-Correlation-Id:
                    $ref: "#/components/headers/XCorrelationId"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Problem"
        AddressPinMismatch:
            description: |
                `ADDRESS_PIN_MISMATCH`: a point sent with `pinSource` `GPS` or `GEOCODE` has
                address text (or a place id) that geocodes more than 5 km from its `lat`/`lon`.
                The request is rejected. Show the user `details.suggested`, ask which
                location is right, then resend that point (`details.field`) with
                `pinSource: CONFIRMED_PIN` and the chosen coordinates. Only one mismatch is
                reported per request; if the other point also mismatches, the retry returns it.
                Other 422s on these endpoints (for example `Insufficient balance` on
                `POST /api/request`) use the plain error envelope with no `details.code`.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AddressPinMismatchError"
                    example:
                        statusCode: 422
                        correlationId: 0f9a6c1e-7b8d-4c2a-9e51-3d2f1a7b6c90
                        method: POST
                        timestamp: "2026-11-17T09:30:00.000Z"
                        path: /api/request
                        url: https://api.waysdrop.com/api/request
                        message: The pin is far from the address you entered. Please confirm the pin on the map.
                        details:
                            code: ADDRESS_PIN_MISMATCH
                            field: destination
                            distanceM: 7342
                            suggested:
                                lat: 6.4474
                                lng: 3.47
                                formattedAddress: 45 Admiralty Way, Lekki Phase 1, Lagos, Nigeria
                        environment: live
                        ip: 203.0.113.10
                        health: https://api.waysdrop.com/health/status
    schemas:
        ApiSuccessResponse:
            type: object
            description: Legacy `/api/*` success envelope.
            required: [success, message, data]
            properties:
                success:
                    const: true
                message:
                    type: string
                data:
                    description: Operation-specific payload
        ApiErrorResponse:
            type: object
            description: |
                Legacy `/api/*` error body (server `SentryExceptionFilter`). `details` is the thrown
                error's own object minus the keys listed at top level: for example
                `{ "error": "Too Many Requests", "quota": { … } }` on a quota 429, or
                `{ "code": "ADDRESS_PIN_MISMATCH", … }`. Validation errors (400) carry every
                constraint message joined with "; " in `message` and `details.error: "Bad Request"`.
            required: [statusCode, message]
            properties:
                statusCode:
                    type: integer
                correlationId:
                    type: string
                    description: Echoes the `X-Correlation-Id` response header. Quote it to support.
                method:
                    type: string
                timestamp:
                    type: string
                    format: date-time
                path:
                    type: string
                    description: Request path without the query string
                url:
                    type: string
                    description: |
                        Full request URL. Includes the query string today; the V2 auth work (AS-9)
                        drops the query string.
                message:
                    description: Human-readable; do not parse. A string from this server; older deployments sent an array of strings for validation errors.
                    oneOf:
                        - type: string
                        - type: array
                          items:
                              type: string
                details:
                    type: object
                    description: |
                        Machine-readable extras. When present, `details.code` is a stable `ErrorCode`
                        (for example `ADDRESS_PIN_MISMATCH`); switch on it, not on `message`.
                    properties:
                        code:
                            type: string
                            pattern: "^[A-Z][A-Z0-9_]{2,63}$"
                            description: One of `ErrorCode`. New codes can be added at any time; handle unknown values (fall back on the HTTP status).
                        error:
                            type: string
                            description: HTTP reason phrase from the framework, e.g. "Bad Request"
                        quota:
                            $ref: "#/components/schemas/QuotaExceededDetails"
                environment:
                    type: string
                    deprecated: true
                    description: Deployment name. Removed by the V2 auth work (AS-9); do not depend on it.
                ip:
                    type: string
                    deprecated: true
                    description: The client IP the server saw. Removed by the V2 auth work (AS-9).
                health:
                    type: string
                    description: URL of the server health endpoint
        AddressPinMismatchError:
            allOf:
                - $ref: "#/components/schemas/ApiErrorResponse"
                - type: object
                  required: [statusCode, details]
                  properties:
                      statusCode:
                          const: 422
                      details:
                          $ref: "#/components/schemas/AddressPinMismatchDetails"
        AddressPinMismatchDetails:
            type: object
            required: [code, field]
            properties:
                code:
                    const: ADDRESS_PIN_MISMATCH
                field:
                    type: string
                    enum: [origin, destination]
                    description: |
                        The request property whose point mismatched. Always set on `/api/*`
                        (every merchant endpoint takes two points). Do not rely on which point
                        is reported first.
                distanceM:
                    type: integer
                    minimum: 0
                    description: |
                        Metres between the sent pin and the geocode of the sent text, rounded
                        to a whole metre (more than 5 km by definition). Sent to every API-key caller; the same
                        error on unauthenticated first-party endpoints omits it, so treat it
                        as optional.
                suggested:
                    $ref: "#/components/schemas/SuggestedLocation"
        SuggestedLocation:
            type: object
            description: |
                Where the address text geocodes. Note `lng`, not `lon`: copy `lng` into the
                point's `lon` when the user accepts the suggestion. Sent to every API-key
                caller; treat it as optional (unauthenticated first-party callers never get it).
            required: [lat, lng, formattedAddress]
            properties:
                lat:
                    type: number
                    minimum: -90
                    maximum: 90
                lng:
                    type: number
                    minimum: -180
                    maximum: 180
                formattedAddress:
                    type: [string, "null"]
        AddressPinSource:
            type: string
            enum: [CONFIRMED_PIN, GPS, PLACE, GEOCODE]
            description: |
                Where a point's pin came from. Omit it to keep the legacy behaviour (the
                server may replace a pin that contradicts the address text).
                - `CONFIRMED_PIN`: the user placed or confirmed the pin on a map. Never moved
                  and never a 422. Requires `lat` and `lon` (400 otherwise).
                - `PLACE`: the pin came from a picked place. Requires `googlePlaceId` (400
                  otherwise). The pin is kept when it is within 50 m of the place, else the
                  place's location is used.
                - `GPS` / `GEOCODE`: the pin came from a device fix or a geocode. Requires
                  `lat` and `lon` (400 otherwise). When `address` or `googlePlaceId` is also
                  sent and geocodes more than 5 km from the pin, the request fails with 422
                  `ADDRESS_PIN_MISMATCH`.
        RoutePoint:
            type: object
            description: |
                A pickup or drop-off point. Send `address`, a `lat`/`lon` pair, or
                `googlePlaceId` (any combination). Coordinates are validated on the
                server: out-of-range, `NaN` or infinite values are rejected with 400.
            properties:
                address:
                    type: string
                    maxLength: 255
                    description: Free-text address. Optional when `lat`/`lon` or `googlePlaceId` is sent.
                    example: Ladipo Kuku Street, Ikeja Lagos
                lat:
                    type: number
                    minimum: -90
                    maximum: 90
                    description: Pin latitude (WGS 84). Send together with `lon`.
                    example: 6.5244
                lon:
                    type: number
                    minimum: -180
                    maximum: 180
                    description: Pin longitude (WGS 84). Send together with `lat`.
                    example: 3.3792
                googlePlaceId:
                    type: string
                    pattern: "^[A-Za-z0-9_-]{10,512}$"
                    description: Google Place ID of the picked place. An empty string is treated as absent.
                    example: ChIJ6cPolh-QOxAR_rCHmFNKObg
                pinSource:
                    $ref: "#/components/schemas/AddressPinSource"
                gpsAccuracyM:
                    type: number
                    minimum: 0
                    maximum: 5000
                    description: Accuracy of the GPS fix behind the pin, in metres. Rounded to a whole number before the range check.
                    example: 12
                gpsFixAt:
                    type: string
                    format: date-time
                    description: When the GPS fix was taken (strict ISO 8601).
                landmark:
                    type: [string, "null"]
                    maxLength: 120
                    description: Nearest landmark or bus stop. Stored for the courier; not returned in partner payloads (see `PartnerAddress`).
                    example: Opposite Shoprite, by the blue gate
                deliveryInstructions:
                    type: [string, "null"]
                    maxLength: 500
                    description: Instructions for the courier. Stored for the courier; not returned in partner payloads (see `PartnerAddress`).
                    example: Call on arrival; the bell is broken
        RouteAddressInput:
            description: |
                A plain address string (legacy form, treated as `{ "address": "<string>" }`
                and trimmed) or a `RoutePoint` object.
            oneOf:
                - type: string
                  minLength: 1
                  maxLength: 255
                - $ref: "#/components/schemas/RoutePoint"
        ApiGetRouteData:
            # Unchanged from partner-api.yaml; repeated here only so ApiCalculateRouteCost/ApiCreateDeliveryRequest
            # read correctly. Server: ApiGetRouteDataDTO (src/api/api.dto.ts:79-95).
            type: object
            required: [origin, destination]
            properties:
                origin:
                    $ref: "#/components/schemas/RouteAddressInput"
                destination:
                    $ref: "#/components/schemas/RouteAddressInput"
        ApiRouteDataResponse:
            allOf:
                - $ref: "#/components/schemas/ApiSuccessResponse"
                - type: object
                  properties:
                      data:
                          type: object
                          required: [distance, routeType, origin, destination]
                          properties:
                              distance:
                                  type: object
                                  properties:
                                      distanceKm:
                                          type: number
                                      etaSeconds:
                                          type: number
                              routeType:
                                  type: string
                              origin:
                                  oneOf:
                                      - $ref: "#/components/schemas/PartnerAddress"
                                      - type: "null"
                              destination:
                                  oneOf:
                                      - $ref: "#/components/schemas/PartnerAddress"
                                      - type: "null"
        PartnerAddress:
            type: object
            description: |
                The address object sent to partners in webhooks and in `/api/*` responses
                (frozen per D26 #14). It is exactly the column set integrators received before
                the 2026-11 address-precision work: no other key is ever sent, and new address
                columns (landmark, delivery instructions, Plus Code, pin metadata) are not
                added here except through a versioned payload.
                Every key is optional: an object carries only the columns its source loaded
                (a freshly geocoded point in `POST /api/route` has no `id` or timestamps).
                `contactName`, `contactPhone`, `contactEmail` and `note` are personal data.
                They go only to keys entitled to the delivery: the key that created it and,
                for store orders, the store owner's keys. Do not log them.
            properties:
                id:
                    type: string
                    format: uuid
                label:
                    type: [string, "null"]
                floor:
                    type: [string, "null"]
                addressLine1:
                    type: string
                addressLine2:
                    type: [string, "null"]
                region:
                    type: [string, "null"]
                regionName:
                    type: [string, "null"]
                lgaOrCity:
                    type: [string, "null"]
                zoneOrDistrict:
                    type: [string, "null"]
                country:
                    type: string
                zipCode:
                    type: [string, "null"]
                regionalZone:
                    type: [string, "null"]
                lat:
                    type: [number, "null"]
                lon:
                    type: [number, "null"]
                state:
                    type: [string, "null"]
                subregion:
                    type: [string, "null"]
                timezone:
                    type: [string, "null"]
                    description: IANA time zone, for example `Africa/Lagos`
                countryCode:
                    type: [string, "null"]
                    description: ISO 3166-1 alpha-2
                googlePlaceId:
                    type: [string, "null"]
                continentCode:
                    type: [string, "null"]
                continentName:
                    type: [string, "null"]
                countryCodeAlpha3:
                    type: [string, "null"]
                adminUnitId:
                    type: [string, "null"]
                adminUnitName:
                    type: [string, "null"]
                adminUnitType:
                    type: [string, "null"]
                adminUnitParentId:
                    type: [string, "null"]
                admin1Id:
                    type: [string, "null"]
                admin1Name:
                    type: [string, "null"]
                admin2Id:
                    type: [string, "null"]
                admin2Name:
                    type: [string, "null"]
                admin3Id:
                    type: [string, "null"]
                admin3Name:
                    type: [string, "null"]
                operationalRegionId:
                    type: [string, "null"]
                h3Index:
                    type: [string, "null"]
                phrase:
                    type: [string, "null"]
                resolution:
                    type: [integer, "null"]
                centerLat:
                    type: [number, "null"]
                centerLon:
                    type: [number, "null"]
                swLat:
                    type: [number, "null"]
                swLon:
                    type: [number, "null"]
                neLat:
                    type: [number, "null"]
                neLon:
                    type: [number, "null"]
                contactName:
                    type: [string, "null"]
                contactPhone:
                    type: [string, "null"]
                contactEmail:
                    type: [string, "null"]
                note:
                    type: [string, "null"]
                deletedAt:
                    type: [string, "null"]
                    format: date-time
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                userId:
                    type: [string, "null"]
                    format: uuid
        ApiCalculateRouteCost:
            # REPLACES existing: adds packageType/items/courierIds, conditional requirements and constraints
            # (src/api/api.dto.ts:97-270).
            allOf:
                - $ref: "#/components/schemas/ApiGetRouteData"
                - type: object
                  properties:
                      packagesId:
                          type: array
                          description: |
                              Your saved, unassigned package ids. When non-empty, pricing uses the packages
                              (packages mode) and `totalWeight`, `packageType` and `items` are ignored.
                          items:
                              type: string
                              format: uuid
                      totalWeight:
                          type: number
                          description: |
                              Total weight in kg. **Required when `packagesId` is absent or empty.** The server
                              only checks it is non-empty (no type check); send a JSON number.
                          example: 100
                      totalValue:
                          type: number
                          description: |
                              Declared value in **USD**. **Required when `packagesId` is absent or empty.** With
                              `packagesId` it optionally overrides the package total (must be >= 0). The server
                              only checks it is non-empty; send a JSON number.
                          example: 1000
                      packageType:
                          type: string
                          description: Item type of `totalWeight`. Ignored with `packagesId` or `items`.
                      items:
                          type: array
                          description: Typed lines making up `totalWeight`. Ignored with `packagesId`.
                          items:
                              $ref: "#/components/schemas/ApiPricingItem"
                      urgencyType:
                          $ref: "#/components/schemas/UrgencyType"
                      deliveryDate:
                          type: string
                          description: |
                              **Required when `urgencyType` is `SCHEDULED`.** `YYYY-MM-DD` or ISO 8601 date-time
                              (`YYYY-MM-DDTHH:mm[:ss[.SSS]][Z|±HH:mm]`). Does not change the price.
                          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])(T([01]\\d|2[0-3]):([0-5]\\d)(:([0-5]\\d)(\\.\\d{1,3})?)?(Z|[+-]\\d{2}:\\d{2})?)?$"
                          example: "2025-01-01"
                      deliverySlot:
                          type: string
                          description: |
                              **Required when `urgencyType` is `SCHEDULED`** (the `slot` alias does not satisfy
                              this). `HH:mm - HH:mm`, 24-hour, end after start.
                          pattern: "^([01]\\d|2[0-3]):([0-5]\\d) - ([01]\\d|2[0-3]):([0-5]\\d)$"
                          example: "10:00 - 13:00"
                      slot:
                          type: string
                          description: Alias for `deliverySlot` (same format). Used only when `deliverySlot` is absent.
                          pattern: "^([01]\\d|2[0-3]):([0-5]\\d) - ([01]\\d|2[0-3]):([0-5]\\d)$"
                      fleetTypeId:
                          type: string
                          format: uuid
                          description: Omit to price the recommended fleet for the weight.
                      courierSelection:
                          $ref: "#/components/schemas/CourierMatching"
                      courierId:
                          type: string
                          format: uuid
                          description: "**Required when `courierSelection` is `SPECIFIC` and `courierIds` is empty.**"
                      courierIds:
                          type: array
                          description: "**Required when `courierSelection` is `SPECIFIC` and `courierId` is absent.** The first id is priced."
                          items:
                              type: string
                              format: uuid
                      courierProfileId:
                          type: string
                          format: uuid
                          description: Alias for `courierId` (does not satisfy the `SPECIFIC` requirement on its own).
                      deliveryFeePayer:
                          $ref: "#/components/schemas/DeliveryFeePayer"
                      currency:
                          type: string
                          description: |
                              ISO 4217 code for the `*Display` fields (packages mode only). Case-insensitive,
                              3 letters (400 otherwise). The `currency` query parameter wins over this.
                          pattern: "^\\s*[A-Za-z]{3}\\s*$"
        # ---------------------------------------------------------------- pricing response
        ApiCreateDeliveryRequest:
            # REPLACES existing: extends ApiGetRouteData only (NOT ApiCalculateRouteCost: totalWeight, totalValue,
            # packageType, items, slot, courierProfileId are stripped here). src/api/api.dto.ts:272-501.
            allOf:
                - $ref: "#/components/schemas/ApiGetRouteData"
                - type: object
                  required: [destinationContactEmail, destinationContactPhone, destinationContactName, packagesId, type, courierSelection]
                  properties:
                      currency:
                          type: string
                          description: ISO 4217 code for the `*Display` fields of this response only. The `currency` query wins.
                          pattern: "^\\s*[A-Za-z]{3}\\s*$"
                      originContactEmail:
                          type: string
                          format: email
                          description: Defaults to your account email.
                      originContactPhone:
                          type: string
                          description: International format with `+` and country code (class-validator `IsPhoneNumber()` with no region). Defaults to your account phone.
                          example: "+2348012345678"
                      originContactName:
                          type: string
                          description: Defaults to your account name. No length limit is validated.
                      destinationContactEmail:
                          type: string
                          format: email
                      destinationContactPhone:
                          type: string
                          description: International format with `+` and country code.
                          example: "+2348012345678"
                      destinationContactName:
                          type: string
                          minLength: 1
                      note:
                          type: string
                          maxLength: 128
                          description: Stored as the delivery note.
                      externalReference:
                          type: string
                          maxLength: 128
                          description: |
                              Idempotency / reconciliation reference, unique per account. A repeat returns the
                              existing delivery (see the operation description), not an error.
                      link3rdPartyByContactInfo:
                          type: boolean
                          default: false
                          description: Notify the recipient in-app when the contact matches a Waysdrop account.
                      notify3rdParty:
                          type: boolean
                          description: Alias of `link3rdPartyByContactInfo`; wins when both are sent.
                      packagesId:
                          type: array
                          description: Your saved, unassigned package ids. Not validated as non-empty at the DTO.
                          items:
                              type: string
                              format: uuid
                      type:
                          $ref: "#/components/schemas/P2pDeliveryType"
                      urgencyType:
                          $ref: "#/components/schemas/UrgencyType"
                      deliveryDate:
                          type: string
                          description: "**Required when `urgencyType` is `SCHEDULED`.** `YYYY-MM-DD` or ISO 8601 date-time."
                          pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])(T([01]\\d|2[0-3]):([0-5]\\d)(:([0-5]\\d)(\\.\\d{1,3})?)?(Z|[+-]\\d{2}:\\d{2})?)?$"
                      deliverySlot:
                          type: string
                          description: "**Required when `urgencyType` is `SCHEDULED`.** `HH:mm - HH:mm`, 24-hour, end after start."
                          pattern: "^([01]\\d|2[0-3]):([0-5]\\d) - ([01]\\d|2[0-3]):([0-5]\\d)$"
                      fleetTypeId:
                          type: string
                          format: uuid
                      requireCollectionProofCode:
                          type: boolean
                          default: true
                      requireDeliveryProofCode:
                          type: boolean
                          default: true
                          description: Ignored when `payOnDelivery` is true.
                      deliveryFeePayer:
                          $ref: "#/components/schemas/DeliveryFeePayer"
                      payPackageValue:
                          type: boolean
                          description: Pay the declared package value upfront with your delivery-fee share. Mutually exclusive with `payOnDelivery`.
                      payOnDelivery:
                          type: boolean
                      podRemitTo:
                          $ref: "#/components/schemas/PodRemitTo"
                          description: "**Required when `payOnDelivery` is true.**"
                      podCourierProfileId:
                          type: string
                          format: uuid
                          description: Validated only when `payOnDelivery` is true and `podRemitTo` is `COURIER_WALLET`.
                      paymentMethodType:
                          $ref: "#/components/schemas/ApiPayMethodType"
                          description: Defaults to `WALLET`. Only `WALLET` and `CHECKOUT` are supported flows.
                      courierSelection:
                          $ref: "#/components/schemas/CourierMatching"
                      courierId:
                          type: string
                          format: uuid
                          description: "**Required when `courierSelection` is `SPECIFIC` and `courierIds` is empty.**"
                      courierIds:
                          type: array
                          description: "**Required when `courierSelection` is `SPECIFIC` and `courierId` is absent.**"
                          items:
                              type: string
                              format: uuid
                      callbackUrl:
                          type: string
                          description: |
                              Post-payment redirect for `CHECKOUT`. Must be http(s) on a Waysdrop-allowed origin;
                              `ref=<checkout reference>` is appended.
        # ---------------------------------------------------------------- delivery request results
        ApiCreateOrEditPackage:
            # REPLACES existing: no `weight` (stripped), size enum without EXTRA_LARGE, quantity 1..999,
            # conditional requirements (src/p2p-delivery/p2p-delivery.dto.ts:52-102, src/api/api.dto.ts:503-508).
            type: object
            description: |
                Create (no `packageId`): `name`, `quantity`, `value` and `size` are required.
                Edit (`packageId`): every other field optional.
            properties:
                packageId:
                    type: string
                    format: uuid
                packageType:
                    type: string
                    example: Electronics
                name:
                    type: string
                    minLength: 1
                    description: "**Required on create.**"
                description:
                    type: string
                    maxLength: 128
                quantity:
                    type: integer
                    minimum: 1
                    maximum: 999
                    description: "**Required on create.**"
                value:
                    type: number
                    minimum: 0
                    description: |
                        **Required on create** (and must be greater than 0 there). Unit value in `inputCurrency`,
                        else in the account's display currency.
                size:
                    $ref: "#/components/schemas/DeliveryPackageSize"
                inputCurrency:
                    type: string
                    description: ISO 4217 code of `value`. Case-insensitive, 3 letters (400 otherwise).
                    pattern: "^\\s*[A-Za-z]{3}\\s*$"
                image:
                    type: string
                    format: uri
                    description: Any URL accepted by class-validator `IsUrl()` (http, https or ftp, with a TLD).
        ApiCreatePaymentCheckout:
            # REPLACES existing: adds externalReference / inputCurrency; amount is exclusive-minimum 0 in 3.1 form
            # (src/api/api.dto.ts:510-573).
            type: object
            required: [amount, customerEmail]
            properties:
                amount:
                    type: number
                    exclusiveMinimum: 0
                    description: |
                        Amount in the payment currency (major units, JSON number). Rounded to 2 decimals by the
                        server. No maximum is validated.
                    example: 5000
                customerEmail:
                    type: string
                    format: email
                externalReference:
                    type: string
                    maxLength: 128
                    description: Preferred reconciliation reference; unique per account (409 on reuse). Trimmed.
                merchantReference:
                    type: string
                    maxLength: 128
                    description: Alias of `externalReference`, used when that is absent.
                inputCurrency:
                    type: string
                    description: ISO 4217 code of `amount`; your home wallet currency or USD. Wins over `currencyCode`.
                    pattern: "^\\s*[A-Za-z]{3}\\s*$"
                currencyCode:
                    type: string
                    description: Alias of `inputCurrency` (validated later in the service, same 400 message).
                callbackUrl:
                    type: string
                    description: http(s) URL on a Waysdrop-allowed origin. `ref=<payment reference>` is appended.
        DisplayMoney:
            # REPLACES existing: adds `local.isStale` / `local.fromSnapshot`; `local.currency`/`amount` are always set
            # when `local` is (src/payment/money.types.ts:26-37, src/payment/money-display.mapper.ts:42-134).
            type: object
            required: [usd]
            description: |
                Display-only conversion of a USD amount. `usd` is the USD amount rounded to 2 decimals
                (JSON number, float). `local` is the amount in the display currency (the `currency` query /
                body override, else the account's currency), rounded to 2 decimals. Every decorator on
                `/api/*` sets `local` today; treat it as optional.
            properties:
                usd:
                    type: number
                local:
                    type: object
                    required: [currency, amount]
                    properties:
                        currency:
                            type: string
                            description: ISO 4217 code.
                        amount:
                            type: number
                        symbol:
                            type: string
                        isStale:
                            type: boolean
                            description: Present when converted at a live rate; true when that rate is past its refresh time.
                        fromSnapshot:
                            type: boolean
                            description: Present (true) when the amount came from the rate saved with the record.
        # ---------------------------------------------------------------- locations
        DeliveryStatus:
            # REPLACES existing: server enum has 13 values and no ACCEPTED (prisma/schema.prisma `enum DeliveryStatus`).
            type: string
            enum:
                - ASSIGNING
                - AWAITING_COLLECTION
                - IN_TRANSIT
                - REASSIGNING
                - DELIVERED
                - CANCELLED
                - ORDER_ASSIGNED
                - ORDER_CONFIRMED
                - ORDER_COLLECTED
                - AWAITING_CONFIRMATION
                - REQUEST_CREATED
                - PACKAGE_ASSIGNED
                - PACKAGE_COLLECTED
        UrgencyType:
            type: string
            enum: [PRIORITY, STANDARD, SCHEDULED]
        CourierMatching:
            type: string
            enum: [ANYONE, SPECIFIC, MERCHANT_SPECIAL_COURIERS]
        P2pDeliveryType:
            type: string
            enum: [PICKUP, DROP_OFF]
        DeliveryFeePayer:
            type: string
            enum: [CREATOR, RECIPIENT, SPLIT]
        PodRemitTo:
            type: string
            enum: [MY_WALLET, COURIER_WALLET]
        DeliveryPackageSize:
            # REPLACES existing: server enum has no EXTRA_LARGE (prisma/schema.prisma `enum DeliveryPackageSize`).
            type: string
            enum: [SMALL, MEDIUM, LARGE]
        QuotaExceededDetails:
            type: object
            description: "`details.quota` on a 429 \"API quota exceeded\" (secret keys)."
            required: [limit, remaining, resetAt, resetIn]
            properties:
                limit:
                    type: [integer, "null"]
                    description: Request limit of the most restrictive quota
                remaining:
                    type: [integer, "null"]
                resetAt:
                    type: string
                    format: date-time
                resetIn:
                    type: integer
                    description: Seconds until `resetAt`
        MoneyWire:
            type: object
            description: |
                An exact amount: integer minor units **as a decimal string** (may exceed 2^53; parse
                with a big-integer or decimal type, never a float) in `currency` (ISO 4217). Minor
                units follow the currency (2 for USD and NGN, 0 for zero-decimal currencies).
            required: [amountMinor, currency]
            properties:
                amountMinor:
                    type: string
                    pattern: "^-?[0-9]{1,30}$"
                    example: "150000"
                currency:
                    type: string
                    pattern: "^[A-Z]{3}$"
                    example: NGN
        ProblemFieldError:
            type: object
            required: [field, message]
            properties:
                field:
                    type: string
                    description: Dotted path of the invalid input, e.g. `items.0.quantity`
                    example: items.0.quantity
                message:
                    type: string
        Problem:
            type: object
            description: |
                `/v2` error body (RFC 9457 style). `code` is the machine key (`ErrorCode`), mirrored in
                `details.code`; `statusCode` and `message` mirror the legacy keys. Extra fields named
                by an operation (for example `attemptsLeft`) are in `details`. 5xx errors that are not
                deliberate carry a generic `detail` and `code: INTERNAL_ERROR`. Never contains `ip`,
                `environment`, `url`, `health` or `method`.
            required: [type, title, status, detail, instance, code, correlationId, statusCode, message, details]
            properties:
                type:
                    type: string
                    pattern: "^urn:waysdrop:problem:[A-Z][A-Z0-9_]{2,63}$"
                    example: urn:waysdrop:problem:IDEMPOTENCY_KEY_REUSED
                title:
                    type: string
                    description: HTTP reason phrase, e.g. "Conflict"
                status:
                    type: integer
                    minimum: 400
                    maximum: 599
                detail:
                    type: string
                    description: Human-readable; do not parse
                instance:
                    type: string
                    description: Request path, without the query string
                code:
                    type: string
                    pattern: "^[A-Z][A-Z0-9_]{2,63}$"
                    description: One of `ErrorCode`. New codes can be added at any time; handle unknown values (fall back on the HTTP status).
                correlationId:
                    type: [string, "null"]
                statusCode:
                    type: integer
                    description: Same as `status`
                message:
                    type: string
                    description: Same as `detail`
                details:
                    type: object
                    required: [code]
                    properties:
                        code:
                            type: string
                            pattern: "^[A-Z][A-Z0-9_]{2,63}$"
                            description: One of `ErrorCode`. New codes can be added at any time; handle unknown values (fall back on the HTTP status).
                    additionalProperties: true
                errors:
                    type: array
                    description: Present only for 400 `VALIDATION_FAILED`
                    items:
                        $ref: "#/components/schemas/ProblemFieldError"
        PageInfo:
            type: object
            required: [limit, nextCursor]
            properties:
                limit:
                    type: integer
                    minimum: 1
                    maximum: 50
                nextCursor:
                    type: [string, "null"]
                    description: Pass as `cursor` for the next page; `null` on the last page.
        ApiDecimalString:
            type: string
            pattern: "^-?\\d+(\\.\\d+)?([eE][-+]?\\d+)?$"
            description: |
                A Prisma `Decimal` serialised by `JSON.stringify` (Decimal.js `toJSON`): a base-10 string
                with no trailing zeros (`"1500"`, `"12.5"`). Exponent notation is possible only for
                magnitudes outside 1e-7..1e21. Parse with a decimal type, never a float.
            example: "1250.5"
        # ---------------------------------------------------------------- enums
        ApiRouteType:
            type: string
            enum: [INTER_CITY, INTER_STATE, INTER_REGION, INTER_COUNTRY, INTER_CONTINENT]
            description: "`INTER_REGION` is deprecated in the schema and not produced by route resolution today."
        ApiDeliveryType:
            type: string
            enum: [P2P, ORDER, ERRAND]
        ApiDeliveryStepType:
            type: string
            enum:
                - REASSIGNED
                - IN_TRANSIT
                - DELIVERED
                - CANCELLED
                - ORDER_CREATED
                - ORDER_ASSIGNED
                - ORDER_CONFIRMED
                - ORDER_COLLECTED
                - REQUEST_CREATED
                - PACKAGE_ASSIGNED
                - PACKAGE_COLLECTED
        ApiProofType:
            type: string
            enum: [DELIVERY, COLLECTION]
        ApiP2pDeliveryStatus:
            type: string
            enum: [PENDING, COMPLETED, CANCELLED, PROCESSING, PENDING_PAYMENT]
        ApiFxSource:
            type: string
            enum: [NOMBA, STRIPE, MERGED, MIGRATION, MANUAL]
        ApiTransactionStatus:
            type: string
            enum: [SUCCESS, PENDING, FAILED]
        ApiPayMethodType:
            type: string
            enum: [CARD, WALLET, CHECKOUT, BANK_ACCOUNT]
            description: The set the server's validator accepts (`@IsEnum(PayMethodType)`).
        ApiDeliveryPackageType:
            type: string
            enum: [ERRAND_ITEM, PACKAGE_ITEM]
        ApiPromotionSettlementMode:
            type: string
            enum: [PLATFORM_FUNDED, TARGET_REDUCED, STORE_FUNDED]
        ApiPromotionDiscountType:
            type: string
            enum: [PERCENTAGE, FIAT]
        ApiCommissionOccurrence:
            type: string
            enum: [PER_TRIP, PER_SALES]
        ApiDeliveryPricingOwnerType:
            type: string
            enum: [STORE, COURIER, MERCHANT]
        # ---------------------------------------------------------------- money display
        ApiGeoPointFields:
            type: object
