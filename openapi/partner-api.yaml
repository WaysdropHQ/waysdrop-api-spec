            description: |
                Creates a DRAFT checkout session for the authenticated account (with a secret API key: the key's
                owner). The draft is priced immediately and the priced view is returned. It expires 2 h after
                creation; every successful PATCH slides that by 2 h.

                - `kind: CART` checks out the account's own cart: the lines named in `lineIds`, or the whole cart
                  when `lineIds` is omitted. The selected cart lines are snapshotted into the session; later cart
                  edits do not change it. `items` is ignored for CART.
