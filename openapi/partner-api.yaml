        patch:
            operationId: updateCheckoutSession
            x-error-codes: [ADDRESS_NOT_FOUND, BAD_REQUEST, CHECKOUT_SESSION_EXPIRED, CHECKOUT_SESSION_NOT_FOUND, CHECKOUT_SESSION_STATE, FLEET_TYPE_NOT_FOUND, INVALID_DELIVERY_SLOT, NO_STORE_INCLUDED, PROMO_CONFLICT, PROMO_INVALID, PROMO_RATE_LIMITED, RATE_LIMITED, VALIDATION_FAILED, WELCOME_GIFT_INELIGIBLE]
            tags: [Commerce (V2)]
            summary: Change the address, per-store delivery, promo codes or the welcome gift
            x-feature-flag: COMMERCE_V2
            security:
                - ApiKeyAuth: []
            description: |
                DRAFT only. Applies the changes, re-prices everything from the database (never from a client
                snapshot), saves and returns the new view. A successful call slides `expiresAt` to now + 2 h.
                Rate limit: 60 requests per minute (per user for JWT callers, per client IP for API-key callers).

                - `addressId` must be one of the account's saved addresses (`null` reads as an unknown address and
                  fails with `ADDRESS_NOT_FOUND`).
                - `stores[]` patches one store leg each. `storeId` must be a store in this checkout.
                  `fleetTypeId` must be an ACTIVE fleet type and marks the fleet as chosen by the buyer.
                  `deliveryDate` and `deliverySlot` go together and imply `urgency: SCHEDULED`; `SCHEDULED`
                  without both, or a date and slot with another urgency, is `INVALID_DELIVERY_SLOT`. To leave a
                  schedule, send `urgency` with `deliveryDate: null` and `deliverySlot: null`. An empty
                  `deliveryNotes` clears the notes. A slot must not have passed and must be at least 1 h long,
                  in the store's time zone.
                - `promoCodes` replaces the whole set. Codes are trimmed and de-duplicated case-insensitively.
                  At most 1 platform code, and at most 1 store code per store. Only codes not already on the
                  session count towards the limit of 10 new codes per 10 minutes per account. A code that was
                  already on the session and is now invalid does not fail the PATCH; it is reported in
                  `invalidCodes`. A newly added code that is invalid fails the PATCH.
                - `useWelcomeGift: true` fails with `WELCOME_GIFT_INELIGIBLE` when the account is not eligible.
                  `X-Device-Id` feeds the one-gift-per-device rule.
