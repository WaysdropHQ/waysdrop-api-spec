            x-error-codes: [BAD_REQUEST, CHECKOUT_SESSION_EXPIRED, CHECKOUT_SESSION_NOT_FOUND, CHECKOUT_SESSION_STATE, FEATURE_DISABLED, VALIDATION_FAILED, WALLET_NOT_ALLOWED]
