                weightFee:
                    $ref: "#/components/schemas/ApiDecimalString"
                urgencyFee:
                    $ref: "#/components/schemas/ApiDecimalString"
                fleetFee:
                    $ref: "#/components/schemas/ApiDecimalString"
                serviceFee:
                    $ref: "#/components/schemas/ApiDecimalString"
                deliveryFee:
                    $ref: "#/components/schemas/ApiDecimalString"
                deliveryFeeTotal:
                    $ref: "#/components/schemas/ApiDecimalString"
                discountAmount:
