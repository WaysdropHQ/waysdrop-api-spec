                (account, credential); a replay carries `Idempotent-Replayed: true`. Separately, the session row
                stores the key per account (not per credential): reusing a key that already created a session for
                this account, from any credential, returns that session's current view (201, no
                `Idempotent-Replayed` header) when the body matches, else `409 IDEMPOTENCY_KEY_REUSED`.

                Errors (`code`, status, `details` keys):
