                distance:
                    $ref: "#/components/schemas/ApiRouteDistance"
                routeType:
                    $ref: "#/components/schemas/ApiRouteType"
                tierIds:
                    $ref: "#/components/schemas/ApiPricingTierIds"
                costs:
                    $ref: "#/components/schemas/ApiPricingCosts"
                breakdown:
                    $ref: "#/components/schemas/ApiPricingBreakdown"
                courierPricingRule:
                    type: "null"
                deliveryPricing:
                    $ref: "#/components/schemas/ApiDeliveryPricingQuote"
        ApiPackageDeliveryCost:
            type: object
            required: [distance, routeType, tierIds, costs, breakdown, courierPricingRule, totalWeight, totalValue]
            properties:
                distance:
                    $ref: "#/components/schemas/ApiRouteDistance"
                routeType:
                    $ref: "#/components/schemas/ApiRouteType"
                tierIds:
                    $ref: "#/components/schemas/ApiPricingTierIds"
                costs:
                    $ref: "#/components/schemas/ApiPricingCostsWithDisplay"
                breakdown:
                    $ref: "#/components/schemas/ApiPricingBreakdown"
                courierPricingRule:
                    type: "null"
                deliveryPricing:
                    $ref: "#/components/schemas/ApiDeliveryPricingQuote"
                totalWeight:
                    type: number
                    description: Sum of package weight × quantity, kg (JSON number).
                totalValue:
                    type: number
                    description: "Declared value in USD (JSON number, float); the `totalValue` override, else the package sum."
                totalValueDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiFeeShareParty:
            type: object
            required: [amount, paymentRequired]
            properties:
                amount:
                    $ref: "#/components/schemas/ApiDecimalString"
                paymentRequired:
                    type: boolean
                amountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiFeeSharePromotion:
            type: object
            required: [settlementMode, platformFunded, settledAmount, discountAmount, isApplied]
            properties:
                settlementMode:
                    $ref: "#/components/schemas/ApiPromotionSettlementMode"
                platformFunded:
                    type: boolean
                settledAmount:
                    $ref: "#/components/schemas/ApiDecimalString"
                discountAmount:
                    $ref: "#/components/schemas/ApiDecimalString"
                isApplied:
                    type: boolean
                settledAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
                discountAmountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiFeeShares:
            type: object
