                      locationId:
                          type: string
                          description: "`googlePlaceId` when known, else `admin:<adminUnitId>`."
                      googlePlaceId:
                          type: string
                      country:
                          type: string
                      countryCode:
                          type: string
                      countryCodeAlpha3:
                          type: string
                      timezone:
                          type: string
                      regionName:
                          type: string
                      continentCode:
                          type: string
                      continentName:
                          type: string
                      subregion:
                          type: string
                      region:
                          type: string
                      lgaOrCity:
                          type: string
                      zoneOrDistrict:
                          type: string
                      regionalZone:
                          type: string
                      state:
                          type: string
                      adminUnitId:
                          type: string
                      adminUnitName:
                          type: string
                      adminUnitType:
                          type: string
                          description: "`admin1`, `admin2` or `admin3` (stored as free text)."
                      adminUnitParentId:
                          type: string
                      admin1Id:
                          type: string
                      admin1Name:
                          type: string
                      admin2Id:
                          type: string
                      admin2Name:
                          type: string
                      admin3Id:
                          type: string
                      admin3Name:
                          type: string
                      operationalRegionId:
                          type: string
        # ---------------------------------------------------------------- route
        ApiRouteDistance:
            type: object
