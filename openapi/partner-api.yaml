                - delivery.cancelled
                - delivery.failed
                - delivery.stop.arrived
                - delivery.stop.completed
                - delivery.stop.failed
                - delivery.plan.changed
                - order.created
                - order.accepted
                - order.declined
                - order.ready
                - order.cancelled
                - order.completed
                - checkout.paid
                - checkout.cancelled
                - payment.succeeded
                - payment.failed
                - payment.refunded
                - ping
