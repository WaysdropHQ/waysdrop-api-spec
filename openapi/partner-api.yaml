                    type: [string, "null"]
                    description: Currency of `amount`; null means `amount` is the USD ledger amount.
                externalReference:
                    type: [string, "null"]
                merchantReference:
                    type: [string, "null"]
                deliveryId:
                    type: [string, "null"]
                    format: uuid
                trackingId:
                    type: [string, "null"]
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
        ApiAccount:
            type: object
            required: [userId, countryCode, displayCurrency, merchantWalletCurrencyCode, storeProfile]
            properties:
                userId:
                    type: string
                    format: uuid
                countryCode:
                    type: [string, "null"]
                    description: ISO 3166-1 alpha-2.
                displayCurrency:
                    type: [string, "null"]
                    description: ISO 4217 code used for `*Display` fields by default (USD when it cannot be resolved).
                merchantWalletCurrencyCode:
                    type: [string, "null"]
                storeProfile:
                    oneOf:
                        - type: "null"
                        - type: object
                          required: [id, name, tag]
                          properties:
                              id:
                                  type: string
                                  format: uuid
                              name:
                                  type: [string, "null"]
                              tag:
                                  type: [string, "null"]
        ApiExchangeRate:
            type: object
            required: [from, to, rate, isStale]
            properties:
                from:
                    type: string
                    description: Upper-cased input.
                to:
                    type: string
                rate:
                    type: number
                    description: One `from` unit in `to`, rounded to `to`'s minor unit (see operation description).
                isStale:
                    type: boolean
        ApiCurrencyConversion:
            type: object
            required: [from, to, amount, convertedAmount, rate, isStale]
            properties:
                from:
                    type: string
                to:
                    type: string
                amount:
                    type: number
                    description: The input amount, echoed.
                convertedAmount:
                    type: number
                    description: Rounded to `to`'s minor unit.
                rate:
                    type: number
                    description: "`convertedAmount / amount`; 0 when `amount` is 0."
                isStale:
                    type: boolean
