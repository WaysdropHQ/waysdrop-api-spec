            required: [payer, gross, creator, recipient, promotion]
            properties:
                payer:
                    $ref: "#/components/schemas/DeliveryFeePayer"
                gross:
                    type: object
                    required: [delivery, serviceFee, hubCommission, bundledTotal]
                    properties:
                        delivery:
                            $ref: "#/components/schemas/ApiDecimalString"
                        serviceFee:
                            $ref: "#/components/schemas/ApiDecimalString"
                        hubCommission:
                            $ref: "#/components/schemas/ApiDecimalString"
                        bundledTotal:
                            $ref: "#/components/schemas/ApiDecimalString"
                        deliveryDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                        serviceFeeDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                        hubCommissionDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                        bundledTotalDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                creator:
                    type: object
                    required: [amount, paymentRequired, paid]
                    properties:
                        amount:
                            $ref: "#/components/schemas/ApiDecimalString"
                        paymentRequired:
                            type: boolean
                        paid:
                            type: boolean
                        amountDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                recipient:
                    type: object
                    required: [amount, paymentRequired, paid, checkoutUrl, processor]
                    properties:
                        amount:
                            $ref: "#/components/schemas/ApiDecimalString"
                        paymentRequired:
                            type: boolean
                        paid:
                            type: boolean
                        checkoutUrl:
                            type: [string, "null"]
                        processor:
                            type: [string, "null"]
                            enum: [PAYSTACK, NOMBA, STRIPE, null]
                        amountDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                promotion:
                    $ref: "#/components/schemas/ApiFeeSharePromotion"
        ApiHubCommissionQuote:
            type: object
            required: [amount, hubId, hubName, settingScope, setting]
            properties:
                amount:
                    $ref: "#/components/schemas/ApiDecimalString"
                hubId:
                    type: string
                    format: uuid
                hubName:
                    type: string
                settingScope:
                    type: string
                    enum: [INDIVIDUAL, GENERAL]
                setting:
                    type: object
                    required: [id, type, value, occurrence]
                    properties:
                        id:
                            type: string
                            format: uuid
                        type:
                            $ref: "#/components/schemas/ApiPromotionDiscountType"
                        value:
                            $ref: "#/components/schemas/ApiDecimalString"
                        occurrence:
                            $ref: "#/components/schemas/ApiCommissionOccurrence"
                amountDisplay:
                    $ref: "#/components/schemas/DisplayMoney"
        ApiSpecificCourierSummary:
            type: object
            required: [id, profilePhoto, name, matching, enablePayOnDelivery, courierEligibleForErrandDelivery, requiresPayOnDelivery]
            properties:
                id:
                    type: string
                    format: uuid
                profilePhoto:
                    type: [string, "null"]
                name:
                    type: [string, "null"]
                matching:
                    type: boolean
                enablePayOnDelivery:
                    type: boolean
                courierEligibleForErrandDelivery:
                    type: boolean
                requiresPayOnDelivery:
                    type: boolean
                    const: false
        ApiPackagePricingQuote:
            type: object
            description: Packages mode of `POST /api/pricing` (`packagesId` non-empty). USD amounts plus `*Display` fields.
            required: [deliveryCost, packages, promotion, feeShares, paymentOptions, deliveryFee, matchingEligible, payOnDelivery]
            properties:
                deliveryCost:
                    $ref: "#/components/schemas/ApiPackageDeliveryCost"
                packages:
                    type: array
                    description: The priced package rows as stored (no `valueDisplay` here).
                    items:
                        $ref: "#/components/schemas/ApiPackage"
                promotion:
                    type: "null"
                    description: Always null on `/api/*` (no promo codes, no automatic promotions).
                feeShares:
                    $ref: "#/components/schemas/ApiFeeShares"
                paymentOptions:
                    type: object
                    required: [payNowDeliveryOnly, payNowWithPackage]
                    properties:
                        payNowDeliveryOnly:
                            $ref: "#/components/schemas/ApiDecimalString"
                        payNowWithPackage:
                            $ref: "#/components/schemas/ApiDecimalString"
                        payNowDeliveryOnlyDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                        payNowWithPackageDisplay:
                            $ref: "#/components/schemas/DisplayMoney"
                courier:
                    $ref: "#/components/schemas/ApiSpecificCourierSummary"
                hubCommission:
                    $ref: "#/components/schemas/ApiHubCommissionQuote"
                deliveryFee:
                    $ref: "#/components/schemas/ApiDeliveryFeeResponsibility"
                matchingEligible:
                    type: boolean
                payOnDelivery:
                    type: object
                    required: [enabled, collectAmount, collectTarget]
                    properties:
                        enabled:
