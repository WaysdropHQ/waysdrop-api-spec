                          $ref: "#/components/schemas/DisplayMoney"
                      totalDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
                      weightDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
                      surchargeDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
                      serviceFeeDisplay:
                          $ref: "#/components/schemas/DisplayMoney"
        ApiPricingBreakdown:
