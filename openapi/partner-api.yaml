                - `CHECKOUT_SESSION_STATE` 409. Not a DRAFT (already placed), or placed concurrently.
                - `ADDRESS_NOT_FOUND` 404.
                - `FLEET_TYPE_NOT_FOUND` 404.
                - `INVALID_DELIVERY_SLOT` 400.
                - `PROMO_RATE_LIMITED` 429.
                - `NO_STORE_INCLUDED` 422. Every store leg is excluded.
                - `PROMO_INVALID` 400 `{ promoCode, reason }`. A newly added code is not valid.
                - `PROMO_CONFLICT` 409 `{ promoCode, reason }`. A second platform code, or a second store code on
