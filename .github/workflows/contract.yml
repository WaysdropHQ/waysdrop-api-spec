name: Contract

on:
    push:
        branches: [main, master]
        tags: ["v*"]
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: chmod +x scripts/*.sh && ./scripts/validate-schemas.sh
            - run: node scripts/compute-signature-fixture.js
