name: Contract

on:
    push:
        branches: [main, master, v2]
        tags: ["v*"]
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # Zero-dependency gates (no npm install): validator self-test, OpenAPI lint,
            # every fixture against its schema, and the webhook signature vectors.
            - run: chmod +x scripts/*.sh && ./scripts/validate-schemas.sh
            - name: Fail if the signature vectors are stale
              run: git diff --exit-code -- fixtures/
