name: Contract

on:
    push:
        branches: [main, master]
        tags: ["v*"]
    pull_request:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: chmod +x scripts/*.sh && ./scripts/validate-schemas.sh
            - run: node scripts/compute-signature-fixture.js
            - name: Validate OAuth fixtures against schemas
              run: |
                  node -e "
                  const fs = require('fs');
                  const path = require('path');
                  const root = process.cwd();
                  const pairs = [
                    ['fixtures/oauth-discovery.json', 'schemas/oauth/discovery.json'],
                    ['fixtures/oauth-token-response.json', 'schemas/oauth/token-response.json'],
                    ['fixtures/oauth-userinfo-profile.json', 'schemas/oauth/userinfo-response.json'],
                  ];
                  for (const [fixture, schemaPath] of pairs) {
                    JSON.parse(fs.readFileSync(path.join(root, fixture), 'utf8'));
                    JSON.parse(fs.readFileSync(path.join(root, schemaPath), 'utf8'));
                  }
                  console.log('OAuth fixture smoke check passed');
                  "
